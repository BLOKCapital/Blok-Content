<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="timeline.js"></script>
    <style>
      @font-face { font-family: "ISerif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf"); }
      @font-face { font-family: "ISerif"; font-style: italic; src: url("assets/fonts/InstrumentSerif-Italic.ttf"); }
      :root {
        --ground: #f6f3e8; --ink: #1d1b16; --muted: #6b6457; --rule: #d9d2bd;
        --sky: #7dd2fd; --indigo: #004eba; --lime: #7ed116; --coral: #ec464d; --earth: #844947; --paper: #fffdf6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--ground); font-family: Inter, sans-serif; color: var(--ink); overflow: hidden; }
      .abs { position: absolute; }
      .serif { font-family: "ISerif", serif; font-weight: 400; }

      /* rail */
      #rail { left: 110px; top: 250px; width: 860px; height: 110px; }
      #rail .line { position: absolute; left: 20px; right: 20px; top: 19px; height: 4px; background: var(--rule); border-radius: 2px; }
      #rail .fill { position: absolute; left: 20px; top: 19px; height: 4px; width: 820px; background: var(--ink); border-radius: 2px; transform-origin: left center; transform: scaleX(0); }
      #rail .node { position: absolute; top: 0; width: 42px; height: 42px; margin-left: -21px; border-radius: 50%; background: var(--ground); border: 4px solid var(--rule); }
      #rail .dot { position: absolute; inset: 5px; border-radius: 50%; background: var(--coral); transform: scale(0); }
      #rail .lab { position: absolute; top: 58px; width: 160px; margin-left: -80px; text-align: center; font: 700 30px Inter, sans-serif; color: var(--muted); }

      #title { left: 90px; top: 420px; width: 900px; font-size: 80px; line-height: 1.0; letter-spacing: -0.01em; }
      #title em { color: var(--coral); font-style: italic; }

      /* bubble */
      .bubble { left: 70px; top: 600px; width: 640px; padding: 34px 40px 40px; background: var(--coral); color: var(--ground); border-radius: 40px; transform-origin: 85% 100%; }
      .bubble .who { font: 600 30px Inter, sans-serif; opacity: .85; margin-bottom: 8px; }
      .bubble .say { font-size: 74px; line-height: 1.0; }
      .bubble .say .w { display: inline-block; }
      .bubble .tail { position: absolute; right: 70px; bottom: -26px; width: 60px; height: 60px; background: var(--coral); transform: rotate(45deg); border-radius: 6px; }
      .year { left: 740px; top: 640px; width: 300px; font-size: 130px; line-height: 1; color: var(--indigo); }

      /* stage */
      #kid { left: 560px; top: 930px; width: 200px; height: 420px; }
      .prop { left: 0; top: 0; width: 1080px; height: 1920px; }
      #subs { left: 70px; right: 70px; top: 1420px; height: 160px; }
      .sub { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 700 64px/1.1 Inter, sans-serif; color: var(--ink); opacity: 0; }
      .sub .k { color: var(--coral); }

      /* grown-up reveal */
      #adult { left: 130px; top: 840px; width: 240px; height: 520px; }
      .bubble.right { left: 400px; top: 640px; width: 610px; transform-origin: 10% 100%; }
      .bubble.right .tail { left: 70px; right: auto; }
      #same { left: 430px; top: 1080px; width: 600px; font-size: 92px; line-height: 1; color: var(--indigo); }
      #cycle { left: 90px; top: 560px; width: 900px; text-align: center; font-size: 140px; line-height: 1.0; }
      #cycle em { color: var(--coral); font-style: italic; }
      #arrows { left: 340px; top: 900px; width: 400px; height: 400px; }
      #next { left: 0; top: 0; width: 1080px; height: 1920px; }
      #next .yr { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-size: 240px; line-height: 1; color: var(--indigo); }
      #next .bubble { left: 220px; top: 860px; width: 640px; text-align: center; transform-origin: 50% 100%; }
      #next .bubble .say { font-size: 140px; letter-spacing: 6px; }
      #next .bubble .tail { right: 290px; }
      /* end */
      #end { left: 0; top: 0; width: 1080px; height: 1920px; background: var(--ground); }
      #end .c1 { position: absolute; left: 90px; right: 90px; top: 400px; text-align: center; font-size: 104px; line-height: 1.02; }
      #end .c1 em { color: var(--coral); font-style: italic; }
      #end .who { position: absolute; left: 420px; top: 680px; width: 240px; height: 520px; }
      #end .arr { position: absolute; left: 515px; top: 1210px; width: 50px; height: 100px; }
      #end .fine { position: absolute; left: 110px; right: 110px; top: 1352px; text-align: center; font: 500 28px/1.4 Inter, sans-serif; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.49" data-width="1080" data-height="1920">

      <!-- rail: the five years, lit as the story reaches them -->
      <div id="rail" class="abs">
        <div class="line"></div><div class="fill"></div>
      </div>

      <div id="title" class="abs serif">What every decade's parents <em>yelled</em> about</div>

      <!-- props by era (behind the kid) -->
      <svg id="p1" class="abs prop" viewBox="0 0 1080 1920">
        <circle cx="250" cy="1330" r="70" fill="#F2A541"/>
        <rect x="0" y="1320" width="1080" height="80" fill="#7ED116"/>
        <rect x="0" y="1320" width="1080" height="8" fill="#5fa80c"/>
        <g id="ball"><circle cx="880" cy="1260" r="56" fill="#fff" stroke="#1d1b16" stroke-width="5"/><path d="M826 1260 Q880 1215 934 1260" fill="none" stroke="#EC464D" stroke-width="10"/></g>
      </svg>
      <svg id="p2" class="abs prop" viewBox="0 0 1080 1920">
        <rect x="0" y="1340" width="1080" height="60" fill="#e9e2cc"/>

        <rect x="150" y="1030" width="250" height="220" rx="40" fill="#7DD2FD"/>
        <g id="scan"><rect x="150" y="1080" width="250" height="10" fill="#fff" opacity=".6"/><rect x="150" y="1160" width="250" height="10" fill="#fff" opacity=".45"/></g>
        <circle cx="440" cy="1070" r="14" fill="#f6f3e8"/><circle cx="440" cy="1120" r="14" fill="#f6f3e8"/>
        <rect x="200" y="1290" width="24" height="50" fill="#5d3331"/><rect x="376" y="1290" width="24" height="50" fill="#5d3331"/>
        <path d="M230 1000 L180 930 M370 1000 L420 930" stroke="#1d1b16" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <svg id="p3" class="abs prop" viewBox="0 0 1080 1920">
        <rect x="0" y="1340" width="1080" height="60" fill="#e9e2cc"/>
        <rect x="80" y="980" width="420" height="300" rx="20" fill="#1d1b16"/>
        <g id="pix">
          <rect x="140" y="1180" width="40" height="40" fill="#7ED116"/><rect x="180" y="1180" width="40" height="40" fill="#7ED116"/><rect x="220" y="1140" width="40" height="40" fill="#7ED116"/>
          <rect x="300" y="1060" width="40" height="40" fill="#EC464D"/><rect x="400" y="1100" width="40" height="40" fill="#7DD2FD"/><rect x="260" y="1180" width="160" height="40" fill="#7ED116"/>
        </g>
        <rect x="270" y="1280" width="40" height="60" fill="#1d1b16"/>
      </svg>
      <svg id="p4" class="abs prop" viewBox="0 0 1080 1920">
        <rect x="0" y="1340" width="1080" height="60" fill="#e9e2cc"/>
        <rect x="60" y="1250" width="520" height="22" rx="8" fill="#844947"/>
        <rect x="110" y="1020" width="400" height="232" rx="18" fill="#1d1b16"/>
        <rect x="128" y="1038" width="364" height="196" rx="8" fill="#fffdf6"/>
        <g id="lchat">
          <rect x="146" y="1056" width="200" height="34" rx="14" fill="#7DD2FD"/>
          <rect x="146" y="1102" width="250" height="34" rx="14" fill="#7DD2FD"/>
          <rect x="250" y="1148" width="224" height="34" rx="14" fill="#004EBA"/>
          <rect x="146" y="1194" width="160" height="28" rx="12" fill="#7ED116"/>
        </g>
        <rect x="80" y="1240" width="480" height="14" rx="6" fill="#3a3630"/>
      </svg>

      <!-- the kid: the one character who carries through every era -->
      <svg id="kid" class="abs" viewBox="0 0 200 420">
        <rect x="58" y="300" width="30" height="110" rx="14" fill="#1d1b16"/>
        <rect x="112" y="300" width="30" height="110" rx="14" fill="#1d1b16"/>
        <rect x="40" y="140" width="120" height="180" rx="44" fill="#004EBA"/>
        <g id="armL"><rect x="14" y="160" width="30" height="120" rx="15" fill="#004EBA"/></g>
        <g id="armR"><rect x="156" y="160" width="30" height="120" rx="15" fill="#004EBA"/></g>
        <circle cx="100" cy="80" r="62" fill="#E8B48A"/>
        <path d="M40 72 Q46 14 100 16 Q156 14 162 70 Q132 44 100 50 Q66 44 40 72 Z" fill="#1d1b16"/>
        <circle id="eyeL" cx="80" cy="88" r="7" fill="#1d1b16"/><circle id="eyeR" cx="122" cy="88" r="7" fill="#1d1b16"/>
        <path id="mouth" d="M86 116 Q100 126 114 116" fill="none" stroke="#1d1b16" stroke-width="5" stroke-linecap="round"/>
        <g id="pad" opacity="0"><rect x="44" y="230" width="112" height="56" rx="26" fill="#3a3630"/><circle cx="72" cy="258" r="9" fill="#7ED116"/><circle cx="128" cy="258" r="9" fill="#EC464D"/></g>
      </svg>

      <div id="year" class="abs year serif"></div>
      <div id="bubbles"></div>

      <!-- the reveal: the 2005 kid grew up -->
      <div id="adult" class="abs"><svg viewBox="0 0 240 520"><rect x="72" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="130" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="46" y="160" width="148" height="230" rx="52" fill="#844947"/><rect x="18" y="180" width="36" height="150" rx="18" fill="#844947"/><g class="finger"><rect x="186" y="110" width="36" height="120" rx="18" fill="#844947"/><circle cx="204" cy="104" r="18" fill="#E8B48A"/></g><circle cx="120" cy="90" r="66" fill="#E8B48A"/><path d="M56 82 Q60 20 120 22 Q182 20 186 80 Q154 52 120 58 Q84 52 56 82 Z" fill="#1d1b16"/><circle cx="98" cy="98" r="7" fill="#1d1b16"/><circle cx="142" cy="98" r="7" fill="#1d1b16"/><path d="M82 76 L108 82 M158 76 L132 82" stroke="#1d1b16" stroke-width="6" stroke-linecap="round"/><rect x="88" y="128" width="64" height="8" rx="4" fill="#5d3331" opacity=".5"/><ellipse class="mouth" cx="120" cy="138" rx="16" ry="10" fill="#5d3331"/></svg></div>
      <div id="bAdult" class="abs bubble right"><div class="who">Dad, 2026</div><div class="say serif">Get off Discord!</div><div class="tail"></div></div>
      <div id="same" class="abs serif">Same kid.</div>

      <div id="cycle" class="abs serif">Yelled at.<br/>Then <em>yelling.</em></div>
      <div id="cyc" class="abs" style="left:0;top:0;width:1080px;height:1920px">
        <svg id="cKid" class="abs" style="left:250px;top:980px;width:150px;height:315px" viewBox="0 0 200 420"><rect x="58" y="300" width="30" height="110" rx="14" fill="#1d1b16"/><rect x="112" y="300" width="30" height="110" rx="14" fill="#1d1b16"/><rect x="40" y="140" width="120" height="180" rx="44" fill="#004EBA"/><rect x="14" y="160" width="30" height="120" rx="15" fill="#004EBA"/><rect x="156" y="160" width="30" height="120" rx="15" fill="#004EBA"/><circle cx="100" cy="80" r="62" fill="#E8B48A"/><path d="M40 72 Q46 14 100 16 Q156 14 162 70 Q132 44 100 50 Q66 44 40 72 Z" fill="#1d1b16"/><circle cx="80" cy="88" r="7" fill="#1d1b16"/><circle cx="122" cy="88" r="7" fill="#1d1b16"/><path d="M86 116 Q100 126 114 116" fill="none" stroke="#1d1b16" stroke-width="5" stroke-linecap="round"/></svg>
        <svg id="cArr" class="abs" style="left:440px;top:1100px;width:200px;height:80px" viewBox="0 0 200 80"><path d="M10 40 H180 M150 14 L184 40 L150 66" stroke="#EC464D" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div id="cAd" class="abs" style="left:680px;top:930px;width:170px;height:368px"><svg viewBox="0 0 240 520"><rect x="72" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="130" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="46" y="160" width="148" height="230" rx="52" fill="#844947"/><rect x="18" y="180" width="36" height="150" rx="18" fill="#844947"/><g ><rect x="186" y="110" width="36" height="120" rx="18" fill="#844947"/><circle cx="204" cy="104" r="18" fill="#E8B48A"/></g><circle cx="120" cy="90" r="66" fill="#E8B48A"/><path d="M56 82 Q60 20 120 22 Q182 20 186 80 Q154 52 120 58 Q84 52 56 82 Z" fill="#1d1b16"/><circle cx="98" cy="98" r="7" fill="#1d1b16"/><circle cx="142" cy="98" r="7" fill="#1d1b16"/><path d="M82 76 L108 82 M158 76 L132 82" stroke="#1d1b16" stroke-width="6" stroke-linecap="round"/><rect x="88" y="128" width="64" height="8" rx="4" fill="#5d3331" opacity=".5"/><ellipse  cx="120" cy="138" rx="16" ry="10" fill="#5d3331"/></svg></div>
      </div>

      <div id="next" class="abs">
        <div class="yr serif">2045?</div>
        <div class="abs bubble"><div class="who">Today's kids, grown up</div><div class="say serif"><span class="d">.</span><span class="d">.</span><span class="d">.</span></div><div class="tail"></div></div>
      </div>

      <div id="subs" class="abs"></div>

      <!-- end card: comments -->
      <div id="end" class="abs">
        <div class="c1 serif">What will they yell about <em>next?</em></div>
        <div class="who"><svg viewBox="0 0 240 520"><rect x="72" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="130" y="360" width="38" height="150" rx="18" fill="#1d1b16"/><rect x="46" y="160" width="148" height="230" rx="52" fill="#844947"/><rect x="18" y="180" width="36" height="150" rx="18" fill="#844947"/><g class="finger"><rect x="186" y="110" width="36" height="120" rx="18" fill="#844947"/><circle cx="204" cy="104" r="18" fill="#E8B48A"/></g><circle cx="120" cy="90" r="66" fill="#E8B48A"/><path d="M56 82 Q60 20 120 22 Q182 20 186 80 Q154 52 120 58 Q84 52 56 82 Z" fill="#1d1b16"/><circle cx="98" cy="98" r="7" fill="#1d1b16"/><circle cx="142" cy="98" r="7" fill="#1d1b16"/><path d="M82 76 L108 82 M158 76 L132 82" stroke="#1d1b16" stroke-width="6" stroke-linecap="round"/><rect x="88" y="128" width="64" height="8" rx="4" fill="#5d3331" opacity=".5"/><ellipse class="mouth" cx="120" cy="138" rx="16" ry="10" fill="#5d3331"/></svg></div>
        <svg class="arr" viewBox="0 0 60 120"><path d="M30 0 V100 M6 76 L30 108 L54 76" stroke="#EC464D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="fine">AI-generated voiceover. Illustrated characters.</div>
      </div>
    </div>

    <script>
      const T = window.TIMELINE;
      const S = (i) => T[i].start, E = (i) => T[i].end, W = (i, j) => T[i].words[j < 0 ? T[i].words.length + j : j];
      const VO_END = T[T.length - 1].end;
      const END_AT = VO_END + 2.5;
      const tl = gsap.timeline({ paused: true });
      const IN = "expo.out", OUT = "power3.in", MOVE = "power3.inOut";

      // ---------- rail ----------
      const rail = document.getElementById("rail");
      const years = ["2000s", "2010s", "2022", "2026", "?"];
      const nodes = years.map((y, i) => {
        const x = 20 + i * 205;
        const n = document.createElement("div"); n.className = "node"; n.style.left = x + "px";
        n.innerHTML = '<div class="dot"></div>';
        const l = document.createElement("div"); l.className = "lab"; l.style.left = x + "px"; l.textContent = y;
        rail.appendChild(n); rail.appendChild(l);
        return { n, dot: n.querySelector(".dot"), l };
      });
      const fill = rail.querySelector(".fill");
      function lightNode(i, t, color) {
        tl.fromTo(nodes[i].dot, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, t);
        tl.fromTo(nodes[i].l, { color: "#6b6457" }, { color: "#1d1b16", duration: 0.2, immediateRender: false }, t);
        tl.fromTo(fill, { scaleX: Math.max(0, (i - 1) / 4) }, { scaleX: i / 4, duration: 0.5, ease: MOVE, immediateRender: false }, t - 0.2);
        if (color) tl.set(nodes[i].dot, { backgroundColor: color }, t);
      }
      // frame 0: 2000s already lit (thumbnail)
      tl.set(nodes[0].dot, { scale: 1 }, 0);
      tl.set(nodes[0].l, { color: "#1d1b16" }, 0);

      // ---------- bubbles ----------
      const bubbleDefs = [
        { line: 0, who: "Mom", text: "Get in the house. It's getting dark!" },
        { line: 2, who: "Dad", text: "Turn off the TV. You'll ruin your eyes." },
        { line: 3, who: "Mom", text: "Put the controller down. Now." },
        { line: 4, who: "Dad", text: "Get off Discord. And stop talking to that AI." },
      ];
      const yearsTxt = { 0: "2000s", 2: "2010s", 3: "2022", 4: "2026" };
      const host = document.getElementById("bubbles");
      const bubbles = bubbleDefs.map((b) => {
        const d = document.createElement("div"); d.className = "abs bubble";
        d.innerHTML = '<div class="who">' + b.who + '</div><div class="say serif">' +
          b.text.split(" ").map((w) => '<span class="w">' + w + "</span>").join(" ") + '</div><div class="tail"></div>';
        host.appendChild(d); gsap.set(d, { opacity: 0 });
        return { ...b, el: d, words: d.querySelectorAll(".w") };
      });
      const yearEl = document.getElementById("year");

      // bubble 0 is on frame 0 (the thumbnail), others pop in with the voice
      tl.set(bubbles[0].el, { opacity: 1 }, 0);
      tl.fromTo(bubbles[0].el, { scale: 0.92 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0);
      tl.set(yearEl, { textContent: "2000s", opacity: 1 }, 0);

      const bubbleOut = [S(1) - 0.05, S(3) - 0.15, S(4) - 0.15, S(5) - 0.1];
      bubbles.forEach((b, k) => {
        if (k > 0) {
          const t0 = S(b.line) - 0.05;
          const n = b.words.length;
          tl.set(b.el, { opacity: 1 }, t0);
          tl.fromTo(b.el, { scale: 0.6, rotation: -4 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, t0);
          b.words.forEach((w, j) => {
            const ww = W(b.line, -(n - j));
            tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, Math.max(t0, ww.s - 0.04));
          });
          tl.set(yearEl, { textContent: yearsTxt[b.line] }, t0);
          tl.fromTo(yearEl, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN, immediateRender: false }, t0);
          lightNode(k, t0);
        }
        tl.to(b.el, { opacity: 0, scale: 0.9, duration: 0.25, ease: OUT }, bubbleOut[k]);
      });
      tl.to(yearEl, { opacity: 0, duration: 0.25, ease: OUT }, S(1) - 0.05);
      tl.to(yearEl, { opacity: 0, duration: 0.25, ease: OUT }, S(5) - 0.15);

      // ---------- title (frame 0, exits after the re-hook) ----------
      tl.set("#title", { opacity: 1 }, 0);
      tl.to("#title", { opacity: 0, y: -20, duration: 0.25, ease: OUT }, S(2) - 0.3);

      // re-hook (line 1): the rail teases the years ahead, ending on the "?"
      [1, 2, 3, 4].forEach((i, k) => {
        const t = W(1, 6).s + k * 0.22;
        tl.fromTo(nodes[i].n, { scale: 1 }, { scale: 1.35, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t);
      });
      tl.fromTo(nodes[4].l, { color: "#6b6457" }, { color: "#EC464D", duration: 0.2, immediateRender: false }, W(1, 6).s + 0.66);

      // ---------- props by era ----------
      const props = ["#p1", "#p2", "#p3", "#p4"];
      const propIn = [0, S(2) - 0.05, S(3) - 0.1, S(4) - 0.1];
      const propOut = [S(2) - 0.15, S(3) - 0.2, S(4) - 0.2, S(5) - 0.1];
      props.forEach((p, k) => {
        if (k === 0) tl.set(p, { opacity: 1 }, 0);
        else tl.fromTo(p, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, propIn[k]);
        tl.to(p, { opacity: 0, x: 60, duration: 0.25, ease: OUT }, propOut[k]);
      });
      gsap.set(props.slice(1), { opacity: 0 });
      // ball bounces through era 1
      for (let i = 0; i * 0.6 < S(2) - 0.3; i++) {
        tl.fromTo("#ball", { y: 0 }, { y: -130, duration: 0.3, ease: "power2.out", immediateRender: false }, i * 0.6);
        tl.fromTo("#ball", { y: -130 }, { y: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, i * 0.6 + 0.3);
      }
      // TV scanlines drift
      tl.fromTo("#scan", { y: 0 }, { y: 120, duration: S(3) - S(2), ease: "none" }, S(2));
      // game pixels jump
      tl.fromTo("#pix", { y: 0 }, { y: -40, duration: 0.25, yoyo: true, repeat: Math.floor((S(4) - S(3)) / 0.5), ease: "power2.out" }, S(3));
      // kid holds the pad in 2022
      tl.fromTo("#pad", { opacity: 0 }, { opacity: 1, duration: 0.2 }, S(3));
      tl.to("#pad", { opacity: 0, duration: 0.2 }, S(4) - 0.2);
      // laptop chat grows in 2026
      tl.fromTo("#lchat rect", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.25, ease: IN }, S(4) + 0.2);
      // kid flinches on each scold
      [0, 2, 3, 4].forEach((l) => {
        const t = l === 0 ? 0.05 : S(l) + 0.1;
        tl.fromTo("#kid", { rotation: 0 }, { rotation: -4, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "50% 100%", immediateRender: false }, t);
      });

      // ---------- the reveal (line 5, 6) ----------
      // the 2005 kid comes back with the ball
      tl.set("#year", { textContent: "2005" }, S(5));
      tl.fromTo("#year", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN, immediateRender: false }, S(5));
      tl.fromTo("#p1", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: IN, immediateRender: false }, S(5));
      tl.fromTo("#kid", { scale: 1 }, { scale: 1.08, duration: 0.6, ease: MOVE, transformOrigin: "50% 100%", immediateRender: false }, W(5, 3).s);
      tl.fromTo(nodes[0].n, { scale: 1 }, { scale: 1.5, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, W(5, 6).s);
      // the kid grows up into the dad, moved left, finger up, bubble on the right
      const g0 = S(6) - 0.1;
      tl.to(["#p1", "#year"], { opacity: 0, duration: 0.25, ease: OUT }, g0);
      tl.to("#kid", { x: -400, scale: 1.25, opacity: 0, duration: 0.6, ease: MOVE, transformOrigin: "50% 100%" }, g0);
      gsap.set(["#adult", "#bAdult", "#same"], { opacity: 0 });
      tl.fromTo("#adult", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: MOVE, transformOrigin: "50% 100%" }, g0 + 0.15);
      tl.fromTo("#bAdult", { opacity: 0, scale: 0.6, rotation: 4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, W(6, 4).s - 0.1);
      tl.fromTo("#adult .finger", { rotation: 0 }, { rotation: 12, duration: 0.15, yoyo: true, repeat: 5, ease: "power2.inOut", transformOrigin: "50% 100%" }, W(6, 4).s);
      tl.fromTo("#same", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, W(6, 1).s);
      tl.to(["#adult", "#bAdult", "#same"], { opacity: 0, duration: 0.25, ease: OUT }, S(7) - 0.25);

      // ---------- the cycle (line 7) ----------
      gsap.set("#cycle", { opacity: 0 });
      tl.fromTo("#cycle", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: IN }, S(7) + 0.2);
      [0, 1, 2, 3].forEach((i, k) => {
        tl.fromTo(nodes[i].n, { scale: 1 }, { scale: 1.35, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, S(7) + 0.4 + k * 0.25);
      });
      gsap.set(["#cKid", "#cArr", "#cAd"], { opacity: 0 });
      tl.fromTo("#cKid", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, W(7, 3).s);
      tl.fromTo("#cArr", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, W(7, 6).s);
      tl.fromTo("#cAd", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", transformOrigin: "50% 100%" }, W(7, -2).s);
      tl.to(["#cycle", "#cyc"], { opacity: 0, y: -30, duration: 0.25, ease: OUT }, S(8) - 0.1);

      // ---------- what's next (line 8) ----------
      gsap.set("#next", { opacity: 0 });
      const yr = nodes[4].l;
      lightNode(4, W(8, -1).s - 0.1, "#004EBA");
      tl.set(yr, { textContent: "2045" }, W(8, -1).s);
      tl.set("#next", { opacity: 1 }, S(8));
      tl.fromTo("#next .yr", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.55, ease: IN }, W(8, -1).s - 0.1);
      tl.fromTo("#next .bubble", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, S(8) + 0.2);
      for (let r = 0; r < 4; r++) {
        tl.fromTo("#next .d", { opacity: 0.2 }, { opacity: 1, duration: 0.18, stagger: 0.18, immediateRender: false }, S(8) + 0.5 + r * 0.8);
      }
      tl.to("#next", { opacity: 0, duration: 0.25, ease: OUT }, S(9) - 0.15);

      // ---------- subtitles ----------
      const subs = document.getElementById("subs");
      const skip = new Set([0, 2, 3, 4]); // the scolds are in the bubbles
      const KEY = /yell|2005|2045|kid|comments|pinned/i;
      T.forEach((L, i) => {
        if (skip.has(i)) return;
        const chunks = []; let cur = [];
        L.words.forEach((w) => { cur.push(w); if (cur.length === 3 || /[.,:!?]$/.test(w.w)) { chunks.push(cur); cur = []; } });
        if (cur.length) chunks.push(cur);
        chunks.forEach((ch, k) => {
          const d = document.createElement("div"); d.className = "sub";
          d.innerHTML = ch.map((w) => (KEY.test(w.w) ? '<span class="k">' + w.w + "</span>" : w.w)).join(" ");
          subs.appendChild(d);
          const t0 = ch[0].s - 0.05;
          const t1 = k < chunks.length - 1 ? chunks[k + 1][0].s - 0.05 : L.end + 0.15;
          tl.set(d, { opacity: 1 }, t0);
          tl.set(d, { opacity: 0 }, t1);
        });
      });

      // ---------- end card: the grown-up asks you ----------
      gsap.set("#end", { opacity: 0 });
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.3 }, S(9) - 0.15);
      tl.fromTo("#end .who", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: IN }, S(9) - 0.1);
      T[9].words.forEach((w) => {
        tl.fromTo("#end .mouth", { scaleY: 0.4 }, { scaleY: 1.4, duration: Math.max(0.08, (w.e - w.s) / 2), yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "50% 50%", immediateRender: false }, w.s);
      });
      tl.fromTo("#end .arr", { y: 0 }, { y: 24, duration: 0.4, yoyo: true, repeat: 5, ease: "power2.inOut" }, S(9) + 0.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
