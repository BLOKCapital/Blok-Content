<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"ISerif";src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:"ISerifI";src:url(fonts/InstrumentSerif-Italic.ttf)}

canvas{position:absolute;left:0;top:0}
</style></head>
<body>
<canvas id="cv"></canvas>
<img id="logo" src="logo-wordmark.png" style="display:none">
<img id="doc" src="doc-1.png" style="display:none">
<script src="timeline.js"></script>
<script>
// Instagram 1080x1920, comment-to-get ending. Content lives in a 1080x1080 box (y 330..1410), subtitles at 1470.
const MODE=location.hash.includes('h')?'h':'v';
const W=MODE=='v'?1080:1920,H=MODE=='v'?1920:1080;
let L=window.TIMELINE; if(MODE=='h') L=L.slice(0,10);
const N=L.length;
const cv=document.getElementById('cv'); cv.width=W; cv.height=H; document.body.style.width=W+'px'; document.body.style.height=H+'px';
const c=cv.getContext('2d');
const BOX=MODE=='v'?{x:0,y:330,s:1}:{x:(1920-1080*0.84)/2,y:20,s:0.84}, SUBY=MODE=='v'?1480:1010, SUBSIZE=MODE=='v'?64:50, PILLY=MODE=='v'?255:0;
const S=i=>L[i].start, E=i=>L[i].end;
const END=E(N-1)+0.6;
window.DURATION=END+(MODE=='v'?2.6:3.4);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const Wd=(i,rx,n=0)=>{const ws=L[i].words.filter(w=>rx.test(w.w));const w=ws[n];return w?w.s:S(i)};
function rnd(i){const x=Math.sin(i*91.7)*43758.5;return x-Math.floor(x)}
const C={linen:'#F6F3E8',indigo:'#004EBA',lime:'#7ED116',coral:'#EC464D',brown:'#844947',sky:'#7DD2FD',ink:'#1d1b16',gold:'#F2C45A',night:'#0e1424'};
function txt(s,x,y,font,col,align='center',alpha=1){c.save();c.globalAlpha*=alpha;c.font=font;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y);c.restore()}
function rr(x,y,w,h,r,col){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=col;c.fill()}
function inBox(f){c.save();c.translate(BOX.x,BOX.y);c.scale(BOX.s,BOX.s);f();c.restore()}
function pill(s,bg,fg,y,alpha=1){c.save();c.globalAlpha*=alpha;c.font='700 30px SMono';const w=c.measureText(s).width+56;rr(W/2-w/2,y,w,60,30,bg);txt(s,W/2,y+31,'700 30px SMono',fg);c.restore()}
function nightBg(t){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1020');g.addColorStop(1,'#1d2640');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){c.globalAlpha=0.25+0.5*rnd(i+5)*(0.6+0.4*Math.sin(t*2+i));c.fillStyle='#fff';c.fillRect(rnd(i+3)*W,rnd(i+7)*H*0.4,2,2)}c.globalAlpha=1}
function sepiaBg(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#efe3c8');g.addColorStop(1,'#d9c49c');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.globalAlpha=.08;for(let i=0;i<500;i++){c.fillStyle=rnd(i)>.5?'#5a3b22':'#fff';c.fillRect(rnd(i+1)*W,rnd(i+2)*H,2,2)}c.globalAlpha=1}
function person(x,y,s,col,t,lean=0){c.save();c.translate(x,y);c.scale(s,s);c.rotate(lean);c.fillStyle=col;
  c.beginPath();c.arc(0,-210,34,0,7);c.fill(); // head
  c.beginPath();c.moveTo(-26,-176);c.lineTo(-42,-60);c.lineTo(42,-60);c.lineTo(26,-176);c.fill();c.fillRect(-46,-180,92,30);
  c.fillRect(-36,-62,28,72);c.fillRect(8,-62,28,72); // legs
  c.fillRect(-58,-270,116,16);c.fillRect(-30,-300,60,34); // hat
  c.restore()}

// L0 hook: 1960s bank at dusk, CLOSED, man at the door
function bank(t){ sepiaBg(); c.fillStyle='rgba(40,30,60,.35)';c.fillRect(0,0,W,H);
  inBox(()=>{
    c.fillStyle='#6d5a48';c.fillRect(110,150,860,820);
    c.fillStyle='#7e6955';c.fillRect(80,130,920,50);
    txt('BANK',540,240,'700 84px SMono','#f3e6c8');
    for(let i=0;i<2;i++){const x=i?700:200;c.fillStyle='#2b2433';c.fillRect(x,330,180,240);c.fillStyle='rgba(242,196,90,.0)';}
    // door
    c.fillStyle='#3b2c22';c.fillRect(420,520,240,450);c.strokeStyle='#2a1f18';c.lineWidth=8;c.strokeRect(420,520,240,450);
    c.beginPath();c.moveTo(540,520);c.lineTo(540,970);c.stroke();
    c.save();c.translate(540,640);c.rotate(-0.06+0.025*Math.sin(t*1.6));rr(-130,-44,260,88,10,C.linen);txt('CLOSED',0,-8,'700 46px SMono',C.coral);txt('OPEN 10 AM – 3 PM',0,28,'700 16px SMono',C.ink);c.restore();
    // clock above door
    c.save();c.translate(540,440);c.fillStyle=C.linen;c.beginPath();c.arc(0,0,50,0,7);c.fill();c.strokeStyle=C.ink;c.lineWidth=5;c.stroke();
    c.lineWidth=6;c.beginPath();c.moveTo(0,0);c.lineTo(Math.sin(Math.PI*0.06)*36,-Math.cos(Math.PI*0.06)*36);c.stroke();c.beginPath();c.moveTo(0,0);c.lineTo(28,8);c.stroke();c.restore();
    c.fillStyle='#5a4a3c';c.fillRect(60,970,960,40);
    person(300+10*Math.sin(t*0.8),1000,1.15,'#2a1f18',t,0.02);
  });
}
function hookOverlay(a){ if(a<=0)return; c.save();c.globalAlpha=a;
  const y0=MODE=='v'?170:540,h=MODE=='v'?380:330;
  const g=c.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,'rgba(5,7,12,0)');g.addColorStop(.15,'rgba(5,7,12,.82)');g.addColorStop(.85,'rgba(5,7,12,.82)');g.addColorStop(1,'rgba(5,7,12,0)');c.fillStyle=g;c.fillRect(0,y0,W,h);
  txt('Locked out of',W/2,y0+110,'112px ISerif',C.linen);
  txt('his own money.',W/2,y0+215,'112px ISerif',C.gold);
  txt('WHAT IT MEANS FOR YOUR FUND: AT THE END',W/2,y0+300,'700 28px SMono',C.sky);
  c.restore()}
// L1: bath idea, chocolate bar -> banknote
function bath(t,a0,tCash){ c.fillStyle='#dfeef5';c.fillRect(0,0,W,H);
  inBox(()=>{
    // tiles
    c.strokeStyle='rgba(0,78,186,.12)';c.lineWidth=3;for(let x=0;x<=1080;x+=90){c.beginPath();c.moveTo(x,0);c.lineTo(x,700);c.stroke()}for(let y=0;y<=700;y+=90){c.beginPath();c.moveTo(0,y);c.lineTo(1080,y);c.stroke()}
    // tub
    c.fillStyle='#fff';c.beginPath();c.roundRect(170,700,740,220,[20,20,110,110]);c.fill();c.strokeStyle='#9fb6c8';c.lineWidth=6;c.stroke();
    c.fillStyle='#8a6a4a';c.fillRect(230,915,30,50);c.fillRect(820,915,30,50);
    // head in tub
    c.fillStyle='#2a1f18';c.beginPath();c.arc(330,670,52,0,7);c.fill();
    for(let i=0;i<9;i++){c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.arc(230+i*75,705+8*Math.sin(t*2+i),34,0,7);c.fill()}
    // thought bubbles
    const p=ease((t-a0-0.3)/0.4);c.globalAlpha=p;
    [[400,590,14],[440,540,22]].forEach(([x,y,r])=>{c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill()});
    c.fillStyle='#fff';c.beginPath();c.ellipse(660,330,330,190,0,0,7);c.fill();c.strokeStyle='#9fb6c8';c.lineWidth=5;c.stroke();
    const q=clamp((t-tCash+0.2)/0.5);
    // chocolate bar
    c.save();c.globalAlpha=p*(1-q);c.translate(660,330);c.rotate(-0.1);rr(-150,-70,300,140,10,'#5a3420');for(let i=0;i<4;i++)for(let j=0;j<2;j++)rr(-140+i*72,-60+j*66,62,56,6,'#6e4128');c.restore();
    // banknote
    c.save();c.globalAlpha=p*q;c.translate(660,330);c.rotate(-0.08);rr(-180,-85,360,170,10,'#cfe3b4');c.strokeStyle='#3f7a00';c.lineWidth=6;c.strokeRect(-165,-70,330,140);txt('CASH',0,6,'700 64px SMono','#3f7a00');c.restore();
    c.globalAlpha=1;
    txt('chocolate',560,620,'64px ISerifI',C.brown,'center',p*(1-q));
    txt('→ cash?',760,620,'64px ISerifI','#3f7a00','center',p*q);
  });
}
// L2: 1967 cash machine in a wall
function atm(t,a0){ sepiaBg(); inBox(()=>{const p=ease((t-a0)/0.5);
  c.fillStyle='#b9a07c';c.fillRect(140,120,800,820);for(let y=140;y<940;y+=44)for(let x=140+(y%88?0:40);x<940;x+=80){c.strokeStyle='rgba(90,59,34,.25)';c.lineWidth=3;c.strokeRect(x,y,80,44)}
  rr(330,300,420,520,16,'#4d4f55');rr(360,330,360,170,10,'#1e2a24');
  txt('CASH',540,415,'700 70px SMono','#a6e07a','center',0.6+0.4*Math.sin(t*4));
  rr(400,560,280,26,8,'#222');rr(420,650,240,70,10,'#2b2d31');
  // note sliding out
  const k=ease((t-a0-0.6)/0.7);rr(440,586,200,10+120*k,4,'#cfe3b4');
  c.save();c.translate(540,190);c.rotate(-0.06);c.globalAlpha=p;c.strokeStyle=C.coral;c.lineWidth=10;c.strokeRect(-200,-80,400,160);txt('1967',0,6,'700 130px SMono',C.coral);c.restore();
  txt('ENFIELD, NORTH LONDON',540,900,'700 32px SMono',C.ink,'center',ease((t-a0-0.4)/0.4));
})}
// L3: Canada, phone at 3am, settled in seconds
function canada(t,a0){ nightBg(t); inBox(()=>{const p=ease((t-a0)/0.4);
  // skyline
  c.fillStyle='#121a30';[[60,300],[160,420],[260,360],[360,520],[470,380],[570,600],[680,430],[780,500],[880,350],[980,450]].forEach(([x,h])=>c.fillRect(x-50,980-h,96,h));
  for(let i=0;i<60;i++){c.fillStyle=rnd(i)>.5?'rgba(242,196,90,.8)':'rgba(242,196,90,.25)';c.fillRect(30+rnd(i+11)*1000,600+rnd(i+13)*360,10,14)}
  // phone
  c.save();c.translate(540,520+30*(1-p));c.globalAlpha=p;rr(-210,-380,420,760,48,'#0b0d12');rr(-190,-355,380,710,36,'#f6f3e8');
  txt('3:12 AM',0,-290,'700 34px SMono',C.ink);txt('SUNDAY',0,-250,'700 20px SMono',C.brown);
  const k=ease((t-a0-0.6)/0.4);
  rr(-160,-170,320,260,24,'#fff');c.strokeStyle='#e3dccb';c.lineWidth=3;c.strokeRect(-160,-170,320,260);
  c.fillStyle=C.lime;c.globalAlpha=p*k;c.beginPath();c.arc(0,-90,52,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=12;c.beginPath();c.moveTo(-24,-90);c.lineTo(-6,-70);c.lineTo(26,-110);c.stroke();c.globalAlpha=p;
  txt('Payment settled',0,10,'600 34px Inter',C.ink);txt('in seconds',0,52,'600 30px Inter',C.indigo,'center',k);
  rr(-160,150,320,86,43,C.coral);txt('24/7 · 365',0,194,'700 38px SMono','#fff');
  c.restore();
  txt('CANADA · REAL-TIME RAIL · 9 NOV 2026',540,1010,'700 26px SMono',C.sky,'center',p);
})}
// L4: money open vs your fund closed
function split(t,a0,tB){ c.fillStyle=C.night;c.fillRect(0,0,W,H); inBox(()=>{const p=ease((t-a0)/0.4),q=ease((t-tB)/0.4);
  rr(60,140,460,700,30,'#16203a');rr(560,140,460,700,30,'#16203a');
  txt('MONEY',290,230,'700 40px SMono',C.sky,'center',p);txt('YOUR FUND',790,230,'700 40px SMono',C.sky,'center',q);
  // moon
  c.globalAlpha=p;c.fillStyle='#f3ecd2';c.beginPath();c.arc(290,420,90,0,7);c.fill();c.fillStyle='#16203a';c.beginPath();c.arc(330,395,82,0,7);c.fill();c.globalAlpha=1;
  rr(140,620,300,110,55,C.lime);txt('OPEN',290,677,'700 56px SMono','#10210a','center',p);
  c.globalAlpha=q;c.fillStyle='#2a3350';c.beginPath();c.arc(790,420,90,0,7);c.fill();txt('z z z',800,420,'700 50px SMono','#9fb0d8');c.globalAlpha=1;
  if(q>0){c.save();c.globalAlpha=q;rr(640,620,300,110,55,C.coral);txt('CLOSED',790,677,'700 52px SMono','#fff');c.restore()}
})}
// L5: price set once at 4pm; 9pm order waits
function clock4(t,a0,tB){ c.fillStyle=C.linen;c.fillRect(0,0,W,H); inBox(()=>{const p=ease((t-a0)/0.4),q=ease((t-tB)/0.4);
  function clk(x,y,h,label,col,a){c.save();c.globalAlpha=a;c.translate(x,y);c.fillStyle='#fff';c.beginPath();c.arc(0,0,150,0,7);c.fill();c.strokeStyle=C.ink;c.lineWidth=10;c.stroke();
    for(let i=0;i<12;i++){c.save();c.rotate(i*Math.PI/6);c.fillStyle=C.ink;c.fillRect(-4,-138,8,22);c.restore()}
    c.lineCap='round';c.lineWidth=12;c.beginPath();c.moveTo(0,0);c.lineTo(Math.sin(h/12*2*Math.PI)*80,-Math.cos(h/12*2*Math.PI)*80);c.stroke();
    c.lineWidth=8;c.beginPath();c.moveTo(0,0);c.lineTo(0,-115);c.stroke();c.restore();
    txt(label,x,y+210,'700 34px SMono',col,'center',a)}
  clk(290,330,4,'4:00 PM',C.indigo,p);
  if(p>0.3){c.save();c.globalAlpha=p;rr(140,600,300,90,45,C.indigo);txt('PRICE SET',290,646,'700 38px SMono','#fff');c.restore()}
  clk(790,330,9,'9:00 PM',C.coral,q);
  if(q>0.3){c.save();c.globalAlpha=q;rr(620,600,340,90,45,C.coral);txt('WAITS…',790,646,'700 38px SMono','#fff');c.restore()}
  txt('one price a day',540,820,'110px ISerif',C.ink,'center',p);
  txt('for most mutual funds',540,920,'700 30px SMono',C.brown,'center',p);
})}
// L6: the $10,000 door
function door(t,a0){ c.fillStyle='#1b1712';c.fillRect(0,0,W,H); inBox(()=>{const p=ease((t-a0)/0.5);
  c.fillStyle='#3a2e22';c.fillRect(250,120,580,860);c.strokeStyle=C.gold;c.lineWidth=12;c.strokeRect(250,120,580,860);
  for(let i=0;i<2;i++)for(let j=0;j<3;j++){c.strokeStyle='rgba(242,196,90,.35)';c.lineWidth=5;c.strokeRect(300+i*250,170+j*270,230,240)}
  c.save();c.translate(540,560);c.scale(0.6+0.4*p,0.6+0.4*p);c.globalAlpha=p;rr(-240,-90,480,180,20,C.linen);txt('MINIMUM',0,-42,'700 30px SMono',C.brown);txt('$10,000',0,26,'700 96px Inter',C.ink);c.restore();
  // lock
  c.save();c.translate(760,700);c.globalAlpha=p;c.strokeStyle=C.gold;c.lineWidth=14;c.beginPath();c.arc(0,-30,34,Math.PI,0);c.stroke();rr(-50,-30,100,80,12,C.gold);c.restore();
  txt('A FUND OF YOUR OWN',540,1030,'700 30px SMono',C.gold,'center',p);
})}
// L7-8: public ledger, no closing bell
function ledger(t,a0,tB){ c.fillStyle=C.linen;c.fillRect(0,0,W,H); inBox(()=>{const p=ease((t-a0)/0.4),q=ease((t-tB)/0.4);
  txt('A PUBLIC LEDGER',540,110,'700 34px SMono',C.brown,'center',p);
  // bell crossed out
  c.save();c.translate(540,270);c.globalAlpha=p;c.fillStyle=C.gold;c.beginPath();c.moveTo(-80,60);c.quadraticCurveTo(-80,-90,0,-90);c.quadraticCurveTo(80,-90,80,60);c.closePath();c.fill();
  c.fillRect(-100,55,200,20);c.beginPath();c.arc(0,90,18,0,7);c.fill();
  c.strokeStyle=C.coral;c.lineWidth=18;c.lineCap='round';c.beginPath();c.moveTo(-120,-110);c.lineTo(120,120);c.stroke();c.restore();
  txt('no closing bell',540,470,'100px ISerif',C.indigo,'center',p);
  // ticking rows
  c.save();c.globalAlpha=q;rr(130,560,820,440,24,'#fff');c.strokeStyle='#e3dccb';c.lineWidth=3;c.strokeRect(130,560,820,440);
  const base=Math.floor((t-tB)*3);const hrs=['09:14 PM','11:52 PM','02:07 AM','04:31 AM','06:48 AM'];
  for(let i=0;i<5;i++){const y=610+i*80,k=clamp((t-tB)*2.2-i);c.globalAlpha=q*k;
    txt(hrs[i],170,y+20,'700 30px SMono',C.ink,'left');txt('✓ recorded',910,y+20,'700 28px SMono','#3f7a00','right');
    c.fillStyle='#ece6d6';c.fillRect(170,y+58,740,3)}
  c.restore();
})}
// L9: BLOK, your own fund from $10
function fund(t,a0){ c.fillStyle=C.night;c.fillRect(0,0,W,H); inBox(()=>{const p=ease((t-a0)/0.5);
  const lg=document.getElementById('logo');
  c.save();c.globalAlpha=p;rr(240,180,600,110,55,C.linen);if(lg.complete&&lg.naturalWidth){const h=54,w=lg.naturalWidth*h/lg.naturalHeight;c.drawImage(lg,540-w/2,235-h/2,w,h)}c.restore();
  txt('your own fund',540,430,'110px ISerif',C.linen,'center',p);
  const s=0.7+0.3*ease((t-a0-0.4)/0.5);c.save();c.translate(540,660);c.scale(s,s);txt('$10',0,0,'700 240px Inter',C.lime,'center',ease((t-a0-0.3)/0.4));c.restore();
  txt('OPEN AT 9 PM. AND AT 3 AM.',540,860,'700 30px SMono',C.sky,'center',ease((t-a0-0.8)/0.4));
})}
function endIG(t,a0){ c.fillStyle=C.linen;c.fillRect(0,0,W,H);const p=ease((t-a0)/0.4);c.save();c.globalAlpha=p;
  const lg=document.getElementById('logo'),dc=document.getElementById('doc');
  if(lg.naturalWidth){const h=46,w=lg.naturalWidth*h/lg.naturalHeight;c.drawImage(lg,540-w/2,225,w,h)}
  txt('7 questions private banks',540,350,'76px ISerif',C.indigo);txt('ask on day one',540,428,'76px ISerif',C.indigo);
  if(dc.naturalWidth){c.save();c.translate(540,640);c.rotate(-0.07);const w=230,h=dc.naturalHeight*w/dc.naturalWidth;c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=40;c.drawImage(dc,-w/2,-h/2,w,h);c.restore()}
  txt('Comment',540,880,'76px ISerif',C.ink);
  rr(540-190,930,380,150,24,C.coral);txt('FUND',540,1007,'700 124px Inter','#fff');
  txt("and I'll DM you all seven",540,1135,'50px ISerif',C.indigo);
  txt('Should your fund keep bankers’ hours? Yes or no?',540,1215,'700 32px Inter',C.ink);
  txt('FOLLOW @BLOK.CAPITAL FOR PART 3 OF BEFORE THE BELL',540,1262,'700 21px SMono',C.brown);
  ['Educational content only, not financial or investment advice.','Investing carries risk and you can lose money.','AI-generated voiceover. Sources in the caption.'].forEach((s,i)=>txt(s,540,1318+i*30,'700 19px SMono','#6b665a'));
  c.restore()}

function endX(t,a0){ c.fillStyle=C.linen;c.fillRect(0,0,W,H);const p=ease((t-a0)/0.4);c.save();c.globalAlpha=p;
  const lg=document.getElementById('logo');if(lg.naturalWidth){const h=50,w=lg.naturalWidth*h/lg.naturalHeight;c.drawImage(lg,960-w/2,150,w,h)}
  txt('Should your fund keep',960,350,'110px ISerif',C.indigo);txt('bankers\u2019 hours?',960,470,'110px ISerif',C.indigo);
  rr(960-260,560,240,100,50,C.lime);txt('YES',960-140,612,'700 50px SMono','#10210a');
  rr(960+20,560,240,100,50,C.coral);txt('NO',960+140,612,'700 50px SMono','#fff');
  txt('BEFORE THE BELL · PART 3 SOON',960,750,'700 28px SMono',C.brown);
  ['Educational content only, not financial or investment advice. Investing carries risk and you can lose money.','AI-generated voiceover. Sources: Payments Canada (9 Nov 2026), Wikipedia (J. Shepherd-Barron), SEC Rule 22c-1.'].forEach((s,i)=>txt(s,960,880+i*34,'700 20px SMono','#6b665a'));
  c.restore()}

// ---------- subtitles ----------
const CH=[];L.forEach(l=>{let g=[];l.words.forEach((w,i)=>{g.push(w);const end=/[.,?!:]$/.test(w.w)||g.length>=3||i===l.words.length-1;if(end){CH.push(g);g=[]}})});
const KEY=/^(closing|locked|money|bath|chocolate|cash|1967|Enfield|Canada|seconds|nights|doesn't|once|4|tomorrow's|\$10,000|miss|bell|clock|BLOK|\$10|FUND|seven)/i;
function subs(t,inkBg){if(MODE=='h'&&t>=END)return;const ch=CH.find(g=>t>=g[0].s-0.05&&t<g[g.length-1].e+0.12);if(!ch)return;
  c.save();c.font=`700 ${SUBSIZE}px Inter`;c.textAlign='left';c.textBaseline='middle';
  const parts=ch.map(w=>w.w);const sp=c.measureText(' ').width;const tw=parts.reduce((a,s)=>a+c.measureText(s).width,0)+sp*(parts.length-1);
  let x=W/2-tw/2;parts.forEach(s=>{const k=KEY.test(s);c.fillStyle=inkBg?(k?C.indigo:C.ink):(k?C.gold:'#fff');
   if(!inkBg){c.shadowColor='rgba(0,0,0,.85)';c.shadowBlur=18;c.shadowOffsetY=4}c.fillText(s,x,SUBY);x+=c.measureText(s).width+sp});c.restore()}

// ---------- master ----------
function draw(t){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalAlpha=1;
  const sc=i=>S(i)-0.15;
  const sEnd=MODE=='v'?sc(10):END;
  let ink=false;
  if(t<sc(1)){bank(t);hookOverlay(t<E(0)?1:clamp(1-(t-E(0))/0.3))}
  else if(t<sc(2)){bath(t,sc(1),Wd(1,/^cash/));ink=true}
  else if(t<sc(3)){atm(t,sc(2));ink=true}
  else if(t<sc(4))canada(t,sc(3));
  else if(t<sc(5))split(t,sc(4),Wd(4,/^fund/));
  else if(t<sc(6)){clock4(t,sc(5),Wd(5,/^Invest/));ink=true}
  else if(t<sc(7))door(t,sc(6));
  else if(t<sc(9)){ledger(t,sc(7),sc(8));ink=true}
  else if(t<sEnd)fund(t,sc(9));
  else if(MODE=='v'){endIG(t,sEnd);ink=true}
  else {endX(t,sEnd);ink=true}
  if(MODE=='h'&&t>=E(0)&&t<sEnd){c.save();const s='BEFORE THE BELL · PART 2';c.font='700 22px SMono';const w=c.measureText(s).width+40;rr(40,36,w,48,24,ink?C.ink:C.linen);txt(s,40+w/2,61,'700 22px SMono',ink?C.linen:C.ink);c.restore()}
  if(MODE=='v'&&t>=E(0)&&t<sEnd)pill('BEFORE THE BELL · PART 2',ink?C.ink:C.linen,ink?C.linen:C.ink,PILLY,clamp((t-E(0))/0.3));
  [1,2,3,4,5,6,7,9].map(sc).concat([sEnd]).forEach(x=>{const d=t-x;if(d>=0&&d<0.18){c.fillStyle=`rgba(255,255,255,${0.35*(1-d/0.18)})`;c.fillRect(0,0,W,H)}});
  subs(t,ink);
}
window.draw=draw;
draw(0.5);
