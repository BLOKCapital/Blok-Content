<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F6F3E8;font-family:Inter,sans-serif;color:#14161c;position:relative;overflow:hidden}
.sheet{position:absolute;left:70px;right:70px;top:90px;bottom:150px;background:#fff;border:3px solid #e2ddcc;border-radius:28px;padding:64px 64px;box-shadow:0 14px 0 #e6e1d0}
.tag{display:inline-block;background:#004EBA;color:#fff;font-weight:700;font-size:28px;padding:10px 22px;border-radius:999px;letter-spacing:.03em}
h1{font-size:76px;line-height:1.05;margin:34px 0 10px;letter-spacing:-.02em}
.sub{font-size:32px;color:#6b6f7a;margin-bottom:46px}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #d9d3c0;padding:30px 0;font-size:36px}
.row b{font-weight:800}.row span{color:#6b6f7a;font-weight:600}
.coral{color:#EC464D}
.stamp{position:absolute;right:40px;bottom:70px;transform:rotate(-12deg);border:9px solid #EC464D;color:#EC464D;font-weight:900;font-size:84px;padding:6px 30px;border-radius:18px;letter-spacing:.02em;background:rgba(255,255,255,.85)}
.foot{position:absolute;left:70px;right:70px;bottom:52px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#6b6f7a}
.foot .b{display:flex;align-items:center;gap:12px;font-weight:800;color:#14161c;font-size:28px}
.foot img{width:48px;height:48px;border-radius:12px}
</style></head><body>
