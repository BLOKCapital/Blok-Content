<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Jak;src:url(fonts/Jakarta.ttf);font-weight:200 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#d8c9a0}canvas{display:block;width:1080px!important;height:1920px!important}
#txt{position:absolute;left:60px;width:960px;top:1270px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 22px;text-align:center}
.w{display:inline-block;font-family:Jak;font-weight:800;font-size:92px;line-height:1.08;color:#fff;letter-spacing:-1.5px;-webkit-text-stroke:14px #101114;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35);transform-origin:50% 80%}
.w.hot{color:#C8F25A}.w.red{color:#FF6B6B}
#pill{position:absolute;top:226px;left:50%;transform:translateX(-50%);font-family:Jak;font-weight:700;font-size:30px;letter-spacing:1px;color:#5a3418;padding:12px 30px;border-radius:8px;background:#f6ecd4;box-shadow:0 4px 0 #b99b6a;white-space:nowrap}
.card{position:absolute;left:50%;font-family:Jak;font-weight:800;color:#3a2412;background:#f6ecd4;border-radius:10px;padding:22px 40px;box-shadow:0 10px 0 #b99b6a,0 18px 30px rgba(60,30,10,.35);white-space:nowrap;transform-origin:50% 100%;opacity:0}
.card .s{display:block;font-size:34px;font-weight:700;color:#7a5a3a;text-align:center}.card .b{display:block;font-size:84px;text-align:center}
#logo{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);height:56px;opacity:0}
.hint{display:none}
</style>
<script type="importmap">{ "imports": { "papercraft/": "../" } }</script>
</head><body>
<canvas id="c"></canvas><div class="hint" id="hint"></div>
<div id="pill"></div><div id="txt"></div>
<div class="card" id="c30" style="top:880px"><span class="s">GRANDMA'S GARDEN</span><span class="b">30 SPRINGS</span></div>
<div class="card" id="cfund" style="top:880px"><span class="s">MY FUND</span><span class="b">FROM $10</span></div>
<div class="card" id="cq" style="top:880px"><span class="s">TELL ME BELOW</span><span class="b">WHAT DID THEY GROW?</span></div>
<div class="card" id="cf" style="top:880px"><span class="s">COMMENT</span><span class="b" style="color:#c0392b">FUND</span></div>
<img id="logo" src="logo-wordmark.png">
<script src="timeline.js"></script><script src="overlay.js"></script>
<script type="module" src="./scene.js"></script>
</body></html>
