<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="timeline.js"></script>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
  @font-face { font-family: Grotesk; src: url(fonts/SpaceGrotesk-500.ttf); font-weight: 500; }
  @font-face { font-family: Grotesk; src: url(fonts/SpaceGrotesk-700.ttf); font-weight: 700; }
  @font-face { font-family: Serif; src: url(fonts/InstrumentSerif.ttf); }
  @font-face { font-family: Serif; src: url(fonts/InstrumentSerif-Italic.ttf); font-style: italic; }
  * { margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div style="position:absolute;opacity:0;font-family:Anton">a<span style="font-family:Grotesk;font-weight:700">a</span><span style="font-family:Grotesk;font-weight:500">a</span><span style="font-family:Serif;font-style:italic">a</span><span style="font-family:Serif">a</span></div>
<script>
// BLOK Capital Ambassador Program launch film. window.draw(t) renders one frame; ?v=1 renders 9:16.
const V = new URLSearchParams(location.search).get('v') === '1';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = Math.min(W, H) / 1080;          // layout unit
const T = window.TIMELINE;
const S = i => T[i].start, E = i => T[i].end;
const ws = (i, k) => T[i].words[k].s;
window.DURATION = 52.5;

const C = { sky:'#7DD2FD', ind:'#004EBA', lime:'#7ED116', lin:'#F6F3E8', cor:'#EC464D', earth:'#844947', ink:'#07111F' };
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = t => 1 - Math.pow(1 - cl(t), 3);
const eio = t => (t = cl(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const back = t => { t = cl(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = (i, j = 0) => { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, t) => a + (b - a) * t;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-W, -H, W * 3, H * 3); }
function font(px, fam = 'Inter', wt = 500, st = '') { ctx.font = `${st} ${wt} ${px}px ${fam}`; }
function text(s, x, y, px, col, fam = 'Inter', wt = 500, align = 'center', st = '') {
  font(px, fam, wt, st); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function fit(s, px, maxW, fam, wt, st = '') { font(px, fam, wt, st); const w = ctx.measureText(s).width; return w > maxW ? px * maxW / w : px; }
function cam(p, z0 = 1, z1 = 1.08, rot = 0, dx = 0, dy = 0) {
  const z = lerp(z0, z1, p);
  ctx.translate(W / 2 + dx * p, H / 2 + dy * p); ctx.scale(z, z); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2);
}
const logo = new Image(); logo.src = 'logo.png';

// ---------- props ----------
const MONO = { bg:'#23272d', face:'#8c929a', dark:'#15181c', arrow:'#7f9479', bar:'#454b53' };
function face(x, y, r, col = MONO.face, dark = MONO.dark, shout = 1) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = dark;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.arc(x + s * r * .35, y - r * .15, r * .1, 0, 7); ctx.fill();
    ctx.lineWidth = r * .08; ctx.strokeStyle = dark; ctx.beginPath();
    ctx.moveTo(x + s * r * .55, y - r * .42); ctx.lineTo(x + s * r * .18, y - r * .3); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(x, y + r * .42, r * .24, r * .26 * shout, 0, 0, 7); ctx.fill();
}
function arrow(x, y, s, col = MONO.arrow, lw = .16) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const P = [[-.5, .4], [-.15, .02], [.05, .2], [.36, -.26]];
  ctx.beginPath(); P.forEach(([a, b], i) => i ? ctx.lineTo(x + a * s, y + b * s) : ctx.moveTo(x + a * s, y + b * s)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + .52 * s, y - .42 * s); ctx.lineTo(x + .18 * s, y - .36 * s); ctx.lineTo(x + .46 * s, y - .08 * s); ctx.closePath(); ctx.fill();
}
function thumb(x, y, w, h, m = MONO, k = 0) {
  rr(x, y, w, h, h * .06); ctx.fillStyle = m.bg; ctx.fill();
  ctx.save(); rr(x, y, w, h, h * .06); ctx.clip();
  face(x + w * .3, y + h * .62, h * .36, m.face, m.dark, 1 + .15 * Math.sin(k));
  arrow(x + w * .74, y + h * .5, h * .55, m.arrow);
  ctx.fillStyle = m.bar; ctx.fillRect(x + w * .06, y + h * .08, w * .5, h * .1);
  ctx.restore();
}
function phone(x, y, w, h, inner) {
  rr(x, y, w, h, w * .14); ctx.fillStyle = '#0d0f12'; ctx.fill();
  ctx.save(); rr(x + w * .05, y + w * .05, w * .9, h - w * .1, w * .1); ctx.clip(); inner(x + w * .05, y + w * .05, w * .9, h - w * .1); ctx.restore();
}
function paper(x, y, w, h, c = '#d9dbdd', line = '#9ea3a8') {
  ctx.fillStyle = c; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = line; ctx.fillRect(x + w * .1, y + h * .1, w * .5, h * .06);
  for (let i = 0; i < 9; i++) ctx.fillRect(x + w * .1, y + h * (.24 + i * .075), w * (i % 3 == 2 ? .55 : .8), h * .025);
}
function person(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - s * .55, s * .26, 0, 7); ctx.fill();
  rr(x - s * .38, y - s * .22, s * .76, s * .62, [s * .34, s * .34, s * .08, s * .08]); ctx.fill();
}
function eye(x, y, w, open, iris = '#6b737c') {
  ctx.save(); ctx.beginPath();
  ctx.moveTo(x - w / 2, y); ctx.quadraticCurveTo(x, y - w * .55 * open, x + w / 2, y); ctx.quadraticCurveTo(x, y + w * .55 * open, x - w / 2, y);
  ctx.fillStyle = '#d6d8db'; ctx.fill(); ctx.clip();
  ctx.fillStyle = iris; ctx.beginPath(); ctx.arc(x, y, w * .2, 0, 7); ctx.fill();
  ctx.fillStyle = '#0b0c0e'; ctx.beginPath(); ctx.arc(x, y, w * .09, 0, 7); ctx.fill(); ctx.restore();
}
function glow(x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}
const noiseC = document.createElement('canvas'); noiseC.width = 240; noiseC.height = 240; const nctx = noiseC.getContext('2d');
function noise(seed, a = 1, scale = 4) {
  const id = nctx.createImageData(240, 240); let s = (seed * 9301 + 49297) >>> 0;
  for (let i = 0; i < id.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  nctx.putImageData(id, 0, 0);
  ctx.save(); ctx.globalAlpha = a; ctx.imageSmoothingEnabled = false;
  const pat = ctx.createPattern(noiseC, 'repeat'); ctx.scale(scale, scale); ctx.fillStyle = pat; ctx.fillRect(0, 0, W / scale + 1, H / scale + 1); ctx.restore();
}
function streaks(t, cols, n = 220, speed = 1) {
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) * .6;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = hash(i) * 6.283, ph = (hash(i, 3) + t * speed * (.6 + hash(i, 5))) % 1, d = Math.pow(ph, 2.2) * R;
    const len = 40 * U + ph * 260 * U;
    ctx.strokeStyle = cols[i % cols.length]; ctx.globalAlpha = ph * .9; ctx.lineWidth = (1 + ph * 4) * U;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); ctx.lineTo(cx + Math.cos(a) * (d + len), cy + Math.sin(a) * (d + len)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function stars(t, n = 260, tw = 1) {
  for (let i = 0; i < n; i++) {
    const x = hash(i, 1) * W, y = hash(i, 2) * H, r = (hash(i, 4) < .9 ? 1.4 : 3.2) * U;
    ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * 2 * tw + i)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function titleCard(s, p, col = '#fff') {
  const px = fit(s, (V ? 300 : 330) * U, W * .74, 'Anton', 400);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.transform(1, 0, -.18, 1, 0, 0);
  const z = 1.12 - .12 * ease(p * 3) + .04 * p; ctx.scale(z, z);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40 * U;
  if (V && s.includes(' ')) { const [a, ...b] = s.split(' '); const p2 = fit(b.join(' '), 300 * U, W * .74, 'Anton', 400), q = Math.min(px * 1.6, p2);
    text(a, 0, -q * .52, q, col, 'Anton', 400); text(b.join(' '), 0, q * .52, q, col, 'Anton', 400); }
  else text(s, 0, 0, px, col, 'Anton', 400);
  ctx.restore();
}
function panel(x, y, w, h, fill = '#11161f', stroke = 'rgba(255,255,255,.12)') { rr(x, y, w, h, 28 * U); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 2 * U; ctx.stroke(); }
function cursor(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * U, s * U); ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 52); ctx.lineTo(13, 40); ctx.lineTo(23, 62); ctx.lineTo(32, 58); ctx.lineTo(22, 37); ctx.lineTo(39, 37); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}
function drawLogo(x, y, s, a = 1) { if (!logo.complete) return; ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(logo, x - s / 2, y - s / 2 * .976, s, s * .976); ctx.restore(); }

// ---------- shots ----------
const shots = [];
const at = (t0, t1, f) => shots.push({ t0, t1, f });

// ACT 1 — sameness (monochrome)
function thumbWall(lt, p, cols, gap, ox = 0, oy = 0, sp = 0) {
  bg('#0e1013'); const tw = W / cols, th = tw * .5625;
  for (let r = -2; r < H / th + 3; r++) for (let c = -2; c < cols + 3; c++)
    thumb(c * tw + gap / 2 + (ox + sp * lt) % tw, r * th + gap / 2 + oy, tw - gap, th - gap, MONO, lt * 9);
}
at(0, .5, (lt, p) => { cam(p, 2.6, 2.3, 0, 0, 0); thumbWall(lt, p, 4, 10 * U); });
at(.5, 1.0, (lt, p) => { cam(p, 1.15, 1.25, -.04); thumbWall(lt, p, 9, 6 * U, 0, 0, 30 * U); });
at(1.0, 1.55, (lt, p) => { // rows of phones, like stadium seats
  bg('#121418'); cam(p, 1.1, 1.18, -.35);
  const pw = 120 * U, ph = 220 * U;
  for (let r = -3; r < 14; r++) for (let c = -4; c < 22; c++) phone(c * pw * 1.15 + r * 40 * U - W * .2, r * ph * .62 - H * .2, pw, ph, (x, y, w, h) => { ctx.fillStyle = '#2a2e34'; ctx.fillRect(x, y, w, h); face(x + w / 2, y + h * .4, w * .3); });
});
at(1.55, 2.3, (lt, p) => { cam(p, 1.0, 1.1, .2 + p * .1); thumbWall(lt, p, 14, 4 * U); });
at(2.3, 3.05, (lt, p) => { // one thumbnail, then copies
  bg('#0e1013'); cam(p, 1, 1.05);
  const w = W * (V ? .8 : .5), h = w * .5625;
  if (p > .45) { const n = 1 + Math.floor((p - .45) * 40); for (let i = 0; i < n; i++) thumb(hash(i, 7) * W - w * .3, hash(i, 8) * H - h * .3, w * .45, h * .45); }
  thumb(W / 2 - w / 2, H / 2 - h / 2, w, h, MONO, lt * 9);
});
at(3.05, 3.65, (lt, p) => { cam(p, 1.3, 1.1); thumbWall(lt, p, 6, 8 * U, 0, -lt * 80 * U); });
at(3.65, 4.1, (lt, p) => { bg('#16191d'); cam(p, 1, 1.15); arrow(W / 2, H / 2, 600 * U, '#93a68c', .14); });
at(4.1, 4.45, (lt, p) => { bg('#101215'); cam(p, 1.05, 1.0, -.6);
  for (let r = -6; r < 30; r++) for (let c = -6; c < 40; c++) arrow(c * 70 * U + ((lt * 600 * U) % (70 * U)), r * 60 * U - lt * 300 * U, 46 * U, r % 7 == 3 ? '#b7c2b3' : '#6e7f68', .2); });
at(4.45, 4.95, (lt, p) => { bg('#1b1e22'); cam(p, 1.2, 1.32); face(W / 2, H / 2, 380 * U, '#9aa0a8', '#111', 1.1 + .1 * Math.sin(lt * 30)); });
at(4.95, 5.75, (lt, p) => { bg('#0e1013'); cam(p, 1.0, 1.12);
  const s = 120 * U; for (let r = 0; r < H / s + 1; r++) for (let c = 0; c < W / s + 1; c++) face(c * s + s / 2, r * s + s / 2, s * .4, '#868c94', '#111', 1 + .2 * Math.sin(lt * 25)); });
at(5.75, 6.2, (lt, p) => { noise(Math.floor(lt * 30) + 11, 1, 5); });
at(6.2, 7.0, (lt, p) => { // tower of factsheets
  bg('#1a1c1f'); cam(p, 1.05, 1.15, 0, 0, 60 * U);
  const w = 520 * U, x = W / 2 - w / 2; const n = 60;
  for (let i = 0; i < n; i++) { const y = H * .95 - i * 14 * U; ctx.fillStyle = i % 2 ? '#c8cbce' : '#b8bcc0'; ctx.fillRect(x + (hash(i) - .5) * 14 * U, y, w, 12 * U); }
  paper(x, H * .95 - n * 14 * U - w * 1.1, w, w * 1.15);
  text('FUND FACTSHEET', W / 2, H * .95 - n * 14 * U - w * .98, 30 * U, '#4a4f55', 'JetBrains Mono', 700);
});
at(7.0, 7.55, (lt, p) => { bg('#2a2d31'); cam(p, 1.0, 1.1, .1);
  const s = 150 * U; for (let r = -1; r < H / s + 2; r++) for (let c = -1; c < W / s + 2; c++) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(c * s + 14 * U, r * s + 14 * U, s * .8, s * .8); paper(c * s + 4 * U, r * s + 4 * U, s * .8, s * .8, '#d3d5d8'); } });
at(7.55, 8.05, (lt, p) => { // field of laptops all playing the same thing
  bg('#1d2a33'); ctx.fillStyle = '#26323b'; ctx.fillRect(0, 0, W, H * .32); cam(p, 1, 1.06);
  for (let r = 0; r < 7; r++) { const y = H * .36 + r * r * 14 * U + r * 40 * U, s = (.35 + r * .22) * U, n = Math.ceil(W / (300 * s)) + 2;
    for (let c = -1; c < n; c++) { const x = c * 300 * s + (r % 2) * 150 * s; ctx.fillStyle = '#c3c7cb'; rr(x, y, 240 * s, 150 * s, 10 * s); ctx.fill(); thumb(x + 12 * s, y + 12 * s, 216 * s, 126 * s, { ...MONO, bg: '#e4b45a', face:'#8a6d33', bar:'#b48a3e', arrow:'#7b6a2c' }, lt * 9); ctx.fillStyle = '#8f949a'; ctx.fillRect(x - 10 * s, y + 150 * s, 260 * s, 14 * s); } }
});
at(8.05, 8.6, (lt, p) => { bg('#0b0d10'); cam(p, 1, 1.04, -.08);
  for (let r = -1; r < 9; r++) { const sp = (900 + r * 120) * U, th = 120 * U;
    for (let k = 0; k < 6; k++) { ctx.globalAlpha = .18; for (let c = -2; c < 12; c++) thumb(c * 230 * U + ((lt * sp + k * 20 * U) % (230 * U)), r * 140 * U, 210 * U, th); } ctx.globalAlpha = 1; } });
at(8.6, 9.3, (lt, p) => { // feed zooms out into noise
  const z = Math.pow(.07, eio(p)); bg('#0e1013'); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const tw = 360 * U, th = tw * .5625, n = Math.ceil(1 / z) + 2;
  const c0 = Math.floor(W / 2 / tw), r0 = Math.floor(H / 2 / th);
  for (let r = -n * 2; r < n * 2; r++) for (let c = -n; c < n; c++) { const x = (c + c0) * tw, y = (r + r0) * th; if (z < .2) { ctx.fillStyle = hash(c, r) > .5 ? '#3a3f46' : '#23272d'; ctx.fillRect(x, y, tw - 8, th - 8); } else thumb(x, y, tw - 8 * U, th - 8 * U); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); noise(Math.floor(lt * 30), cl(p * 1.6 - .5) * .9, 4);
});
at(9.3, 10.0, (lt, p) => { noise(Math.floor(lt * 30) + 99, 1, 3); ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 0; y < H; y += 6 * U) ctx.fillRect(0, y, W, 2 * U); });
at(10.0, 10.95, (lt, p) => { // tunnel of identical frames
  bg('#050607');
  for (let i = 18; i >= 0; i--) { const d = i - (lt * 6) % 1, s = Math.pow(.78, d), w = W * .9 * s, h = H * .9 * s;
    ctx.strokeStyle = `rgba(200,205,210,${.9 * s})`; ctx.lineWidth = 6 * U * s; ctx.strokeRect(W / 2 - w / 2, H / 2 - h / 2, w, h);
    if (i % 3 == 0) { ctx.globalAlpha = .5 * s; thumb(W / 2 - w * .2, H / 2 + h * .1, w * .4, w * .4 * .5625); ctx.globalAlpha = 1; } }
  glow(W / 2, H / 2, 140 * U, 'rgba(255,255,255,.7)');
});
at(10.95, 11.6, (lt, p) => { bg('#111316'); cam(p, 1.1, 1.0);
  const s = 200 * U, open = cl(Math.abs(Math.sin(lt * 4.2)) * 1.2);
  for (let r = 0; r < H / (s * .7) + 1; r++) for (let c = 0; c < W / s + 1; c++) { ctx.fillStyle = '#1e2125'; ctx.fillRect(c * s, r * s * .7, s - 4 * U, s * .7 - 4 * U); eye(c * s + s / 2, r * s * .7 + s * .35, s * .62, open); } });
at(11.6, 12.3, (lt, p) => { // looking up a skyscraper of feeds
  bg('#0f1a24'); cam(p, 1, 1.1, 0, 0, 40 * U);
  for (let r = 0; r < 26; r++) { const k = Math.pow(.88, r), y = H - (1 - k) * H * 1.15 - 50 * U * k, w = W * 1.3 * k, x0 = W / 2 - w / 2, cols = 7;
    for (let c = 0; c < cols; c++) { const cw = w / cols; thumb(x0 + c * cw + 3, y - cw * .5, cw - 6, cw * .5, { ...MONO, bg:'#2b3a46', face:'#7e8d99', bar:'#3c4d5a', arrow:'#6b8a80' }); } }
});
at(12.3, 12.85, (lt, p) => { bg('#0e1013'); cam(p, 1, 1.05);
  const w = W * (V ? .7 : .42), h = w * .5625; for (let i = 14; i >= 0; i--) { const o = i * (36 + p * 26) * U; thumb(W / 2 - w / 2 - o + 260 * U, H / 2 - h / 2 - o * .55 + 160 * U, w, h); } });
at(12.85, 13.6, (lt, p) => { // one tile lights up
  bg('#0e1013'); cam(p, 1, 1.25);
  const cols = 9, tw = W / cols, th = tw * .5625, gc = 4, gr = Math.floor(H / th / 2);
  for (let r = 0; r < H / th + 1; r++) for (let c = 0; c < cols; c++) if (!(c == gc && r == gr)) thumb(c * tw + 4, r * th + 4, tw - 8, th - 8);
  const k = ease((lt - .15) * 3);
  thumb(gc * tw + 4, gr * th + 4, tw - 8, th - 8, k > .5 ? { bg: C.lime, face: C.lin, dark: C.ink, arrow: C.ind, bar: '#5fa80e' } : MONO);
  glow(gc * tw + tw / 2, gr * th + th / 2, tw * 1.4 * k, 'rgba(126,209,22,.7)');
});
at(13.6, 14.85, (lt, p) => { // a door opens in the wall of copies
  bg('#0e1013'); const z = 1 + Math.pow(cl((p - .35) / .65), 2.4) * 14; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  const cols = 9, tw = W / cols, th = tw * .5625;
  for (let r = -1; r < H / th + 1; r++) for (let c = -1; c < cols + 1; c++) thumb(c * tw + tw * .5 - (W / 2 % tw) + 4, r * th + 4 + (H / 2 % th) - th / 2, tw - 8, th - 8);
  const dw = 150 * U, dh = 270 * U, x = W / 2 - dw / 2, y = H / 2 - dh / 2, o = ease(p * 2.2);
