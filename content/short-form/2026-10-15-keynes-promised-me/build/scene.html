<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  canvas{display:block}
  #cap{position:absolute;left:0;right:0;top:1400px;text-align:center;font-family:Inter;font-weight:800;
       font-size:58px;line-height:1.18;color:#fff;letter-spacing:-0.5px;
       text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.6)}
  #cap span{display:inline-block;max-width:820px;background:rgba(12,8,24,.72);padding:18px 30px;border-radius:26px;text-shadow:none}
  #cap .b{color:#FFC59A}
  #tag{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:Inter;font-weight:700;font-size:30px;
       color:rgba(255,255,255,.75);letter-spacing:3px;text-transform:uppercase}
  #end{position:absolute;inset:0;background:#F6F3E8;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
  #end img{width:560px}
  #end .l1{font-family:Inter;font-weight:800;font-size:64px;color:#004EBA;margin-top:70px;text-align:center;line-height:1.15;letter-spacing:-1px}
  #end .l2{font-family:Inter;font-weight:500;font-size:30px;color:#844947;margin-top:60px;text-align:center;line-height:1.5}
  #end .btn{margin-top:50px;background:#7ED116;color:#0d2a00;font-family:Inter;font-weight:800;font-size:38px;padding:22px 56px;border-radius:60px}
</style></head>
<body>
<div id="cap"></div>
<div id="tag">Keynes, 1930</div>
<div id="end">
  <img src="../../../../brand/assets/logo-wordmark.png">
  <div class="l1">Your money can work<br>all week. You don't have to.</div>
  <div class="btn">Follow @blok.capital</div>
  <div class="l2">Educational only · Not financial advice<br>AI-generated voices and animation</div>
</div>
<script type="module">
import * as THREE from './three.module.js';
const TL = await (await fetch('./timeline.json')).json();
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#07040f');
scene.fog = new THREE.Fog('#07040f', 14, 40);

// deterministic random
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .75, metalness: 0, ...o });
function jitter(geo, amt) { // low-poly facet look
  geo = geo.toNonIndexed ? geo : geo; const p = geo.attributes.position; const key = new Map();
  for (let i = 0; i < p.count; i++) { const k = [p.getX(i), p.getY(i), p.getZ(i)].map(v => v.toFixed(3)).join();
    if (!key.has(k)) key.set(k, [(rnd() - .5) * amt, (rnd() - .5) * amt, (rnd() - .5) * amt]);
    const d = key.get(k); p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]); }
  geo.computeVertexNormals(); return geo;
}
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };

// ---------- textures ----------
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const cityTex = canvasTex(2048, 1024, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b0620'); gr.addColorStop(1, '#2a1240');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.filter = 'blur(10px)';
  for (let i = 0; i < 40; i++) { const bw = 60 + rnd() * 140, bh = 200 + rnd() * 600, x = rnd() * w; g.fillStyle = '#120a26'; g.fillRect(x, h - bh, bw, bh); }
  g.filter = 'blur(6px)';
  for (let i = 0; i < 260; i++) { const r = 6 + rnd() * 26, x = rnd() * w, y = h * .35 + rnd() * h * .65;
    const c = ['255,196,92', '255,150,70', '255,226,150', '255,120,90', '200,170,255'][Math.floor(rnd() * 5)];
    const gg = g.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, `rgba(${c},.95)`); gg.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
});
function uiTex(bright) { return canvasTex(2048, 1152, (g, w, h) => {
  g.fillStyle = '#0a0e24'; g.fillRect(0, 0, w, h); g.filter = 'blur(5px)';
  const pan = (x, y, pw, ph, c) => { g.fillStyle = c; g.fillRect(x, y, pw, ph); };
  pan(0, 0, w, 70, '#141a3c');
  for (let i = 0; i < 6; i++) { g.fillStyle = ['#ff5f57', '#febc2e', '#28c840'][i % 3]; g.beginPath(); g.arc(40 + i * 36, 35, 11, 0, 7); g.fill(); }
  pan(30, 110, 600, 1000, '#111735'); pan(670, 110, 860, 480, '#131c44'); pan(670, 620, 860, 490, '#111735'); pan(1570, 110, 450, 1000, '#16133a');
  for (let i = 0; i < 26; i++) { pan(60, 150 + i * 36, 120 + rnd() * 420, 14, ['#3b4a9a', '#5a3b9a', '#2f7a8a', '#7a5a2a'][i % 4]); }
  for (let i = 0; i < 12; i++) { pan(700, 150 + i * 34, 200 + rnd() * 560, 14, '#2c3a7a'); }
  // chart-free status tiles
  for (let i = 0; i < 8; i++) { const x = 1600, y = 150 + i * 118; pan(x, y, 390, 90, '#1d1a4a');
    g.fillStyle = ['#28c840', '#ff5f57', '#febc2e', '#5aa0ff'][i % 4]; g.beginPath(); g.arc(x + 40, y + 45, 14, 0, 7); g.fill();
    pan(x + 75, y + 35, 160 + rnd() * 120, 18, '#3a3a7a'); }
  g.filter = 'none';
  if (bright) { g.fillStyle = 'rgba(126,209,22,.18)'; g.fillRect(670, 620, 860, 490);
    g.filter = 'blur(3px)'; g.fillStyle = '#c8ff7a'; g.font = '800 230px Inter'; g.textAlign = 'center'; g.fillText('24/7', 1100, 960); g.filter = 'none'; }
  else { g.filter = 'blur(3px)'; g.fillStyle = '#7d86c8'; g.font = '800 120px Inter'; g.textAlign = 'center';
    g.fillText('9:30 – 4:00', 1100, 900); g.font = '600 52px Inter'; g.fillText('MON – FRI', 1100, 990); g.filter = 'none'; }
}); }
const uiA = uiTex(false), uiB = uiTex(true);

// ---------- set ----------
const city = mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshBasicMaterial({ map: cityTex, fog: false }), 0, 12, -22); scene.add(city);
const monMat = new THREE.MeshBasicMaterial({ map: uiA, toneMapped: false, color: '#b9b4d8' });
const monitor = new THREE.Group(); scene.add(monitor); monitor.position.set(-2.5, 4.6, -4.2);
monitor.add(mesh(new THREE.BoxGeometry(17.4, 10.2, .4), M('#0d0b14')));
const screen = mesh(new THREE.PlaneGeometry(16.8, 9.45), monMat, 0, 0, .21); monitor.add(screen);
// keyboard
const kb = new THREE.Group(); scene.add(kb);
kb.add(mesh(jitter(new THREE.BoxGeometry(16, .6, 6, 6, 1, 3), .05), M('#1d1b24', { roughness: .6 }), 0, 0, 0));
const keyMat = M('#2d2b36', { roughness: .55 }), keyLit = M('#2d2b36', { emissive: '#5b3cff', emissiveIntensity: .35 });
for (let r = 0; r < 6; r++) for (let c = 0; c < 18; c++) {
  const kx = -7.6 + c * .86 + (r % 2) * .2, kz = -2.6 + r * .86; if (kx > 7.6) continue;
  const lit = rnd() < .08; const k = mesh(jitter(new THREE.BoxGeometry(.72, .22, .72, 1, 1, 1), .03), lit ? keyLit : keyMat, kx, .38, kz); kb.add(k); }
const KB_TOP = .49;
// lights
scene.add(new THREE.HemisphereLight('#6a4cff', '#120820', .9));
const key = new THREE.DirectionalLight('#ffcf9a', 2.6); key.position.set(2.5, 5, 9); scene.add(key);
const rim = new THREE.DirectionalLight('#8f7dff', 2.2); rim.position.set(-4, 4, -6); scene.add(rim);
const fill = new THREE.PointLight('#ff9a52', 6, 9, 1.5); fill.position.set(3, 2, 4); scene.add(fill);
const screenGlow = new THREE.PointLight('#6f86ff', 10, 14, 1.4); screenGlow.position.set(-1, 3.5, -2); scene.add(screenGlow);

// contact shadows
const shTex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,.7)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
const shadow = (x, z, s) => { const m = mesh(new THREE.PlaneGeometry(s, s * .6), new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false }), x, KB_TOP + .02, z); m.rotation.x = -Math.PI / 2; scene.add(m); };

// ---------- the man ----------
const skin = M('#f0c3a0'), suit = M('#4a3fd8', { roughness: .65 }), shirt = M('#f4f1ea'), tieM = M('#7b2fb5'), hairM = M('#3a2416'), dark = M('#14101c'), shoeM = M('#1a1420');
const man = new THREE.Group(); scene.add(man);
const MAN_POS = new THREE.Vector3(-0.85, KB_TOP + .08, 1.75); man.position.copy(MAN_POS); man.rotation.y = .32;
shadow(-0.75, 2.0, 1.6);
const torso = new THREE.Group(); man.add(torso);
torso.add(mesh(jitter(new THREE.CylinderGeometry(.3, .27, .78, 7, 2), .03), suit, 0, .42, 0));
torso.add(mesh(new THREE.BoxGeometry(.2, .36, .05), shirt, 0, .6, .255));
const tie = mesh(new THREE.BoxGeometry(.07, .3, .04), tieM, 0, .55, .29); torso.add(tie);
torso.add(mesh(new THREE.CylinderGeometry(.09, .1, .14, 6), skin, 0, .86, 0));
torso.add(mesh(new THREE.CylinderGeometry(.13, .14, .06, 7), shirt, 0, .8, 0));
// head
const head = new THREE.Group(); head.position.set(0, 1.12, 0); torso.add(head);
const headMesh = mesh(jitter(new THREE.IcosahedronGeometry(.27, 1), .025), skin); headMesh.scale.set(.9, 1.08, .95); head.add(headMesh);
const hcap = mesh(jitter(new THREE.SphereGeometry(.29, 8, 5, 0, Math.PI * 2, 0, Math.PI * .42), .02), hairM, 0, .04, -.02); hcap.rotation.x = -.25; head.add(hcap);
for (let i = 0; i < 16; i++) { const a = rnd() * Math.PI * 2, el = .25 + rnd() * .55; const s = mesh(new THREE.ConeGeometry(.075, .2 + rnd() * .1, 4), hairM);
  const dir = new THREE.Vector3(Math.cos(a) * Math.sin(el), Math.cos(el), Math.sin(a) * Math.sin(el)); if (dir.z > .55) dir.z *= .4;
  s.position.copy(dir.clone().multiplyScalar(.27)).add(new THREE.Vector3(0, .07, -.03)); s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().add(new THREE.Vector3(0, .6, -.2)).normalize()); head.add(s); }
for (let i = -2; i <= 2; i++) { const s = mesh(new THREE.ConeGeometry(.06, .17, 4), hairM, i * .07, .2, .2); s.rotation.x = 1.05; s.rotation.z = -i * .15; head.add(s); }
const eyes = []; const pupils = []; const brows = [];
for (const sx of [-1, 1]) {
  const e = mesh(new THREE.BoxGeometry(.085, .06, .02), shirt, sx * .085, .02, .245); head.add(e); eyes.push(e);
  const p = mesh(new THREE.BoxGeometry(.038, .045, .02), dark, sx * .085, .02, .258); head.add(p); pupils.push(p);
  const b = mesh(new THREE.BoxGeometry(.11, .025, .03), hairM, sx * .09, .1, .245); head.add(b); brows.push(b);
}
const nose = mesh(new THREE.ConeGeometry(.035, .09, 4), skin, 0, -.04, .27); nose.rotation.x = Math.PI / 2; head.add(nose);
const mouth = mesh(new THREE.BoxGeometry(.11, .02, .02), M('#5a1a22'), 0, -.13, .235); head.add(mouth);
for (const sx of [-1, 1]) head.add(mesh(new THREE.BoxGeometry(.04, .09, .07), skin, sx * .245, 0, 0));
// arms
const arms = [];
for (const sx of [-1, 1]) {
  const sh = new THREE.Group(); sh.position.set(sx * .36, .74, 0); torso.add(sh);
  sh.add(mesh(new THREE.CylinderGeometry(.085, .075, .4, 6), suit, 0, -.2, 0));
  const el = new THREE.Group(); el.position.y = -.4; sh.add(el);
  el.add(mesh(new THREE.CylinderGeometry(.075, .065, .36, 6), suit, 0, -.18, 0));
  el.add(mesh(new THREE.CylinderGeometry(.068, .068, .05, 6), shirt, 0, -.36, 0));
  el.add(mesh(jitter(new THREE.IcosahedronGeometry(.07, 0), .01), skin, 0, -.42, 0));
  arms.push({ sh, el, sx });
}
// legs
for (const sx of [-1, 1]) {
  const hp = new THREE.Group(); hp.position.set(sx * .14, .05, 0); man.add(hp);
  const th = mesh(new THREE.CylinderGeometry(.1, .09, .5, 6), suit, 0, 0, .25); th.rotation.x = Math.PI / 2; hp.add(th);
  const sn = mesh(new THREE.CylinderGeometry(.085, .075, .5, 6), suit, 0, -.25, .5); hp.add(sn);
  hp.add(mesh(new THREE.BoxGeometry(.13, .1, .26), shoeM, 0, -.52, .56));
}

// ---------- the bot ----------
const orange = M('#D9774F', { roughness: .7 }), botDark = M('#120c0a');
const bot = new THREE.Group(); scene.add(bot);
const BOT_POS = new THREE.Vector3(0.95, KB_TOP, 1.9); bot.position.copy(BOT_POS); bot.rotation.y = -.42;
shadow(0.95, 1.95, 1.3);
const botBody = new THREE.Group(); bot.add(botBody);
botBody.add(mesh(jitter(new THREE.BoxGeometry(.78, .56, .5, 2, 2, 2), .035), orange, 0, .5, 0));
for (const sx of [-1, 1]) botBody.add(mesh(jitter(new THREE.BoxGeometry(.16, .16, .26, 1, 1, 1), .02), orange, sx * .47, .48, 0));
for (const [lx, lz] of [[-.27, .14], [-.1, .14], [.1, .14], [.27, .14]]) bot.add(mesh(new THREE.BoxGeometry(.09, .24, .12), orange, lx, .12, lz - .08));
const botEyes = [];
for (const sx of [-1, 1]) { const e = mesh(new THREE.BoxGeometry(.07, .16, .03), botDark, sx * .15, .56, .255); botBody.add(e); botEyes.push(e); }

// ---------- animation helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
// man expression/pose per line (index) — applied while that line and until next M line
const MAN = {
  0: { brow: .35, eye: 1.1, pose: 'rest', look: .15 },
  2: { brow: .3, eye: 1, pose: 'palms', look: .25 },
  4: { brow: -.1, eye: 1.15, pose: 'rest', look: .25, smile: 1 },
  6: { brow: .45, eye: .8, pose: 'rest', look: -.1, down: .25 },
  8: { brow: -.35, eye: 1.35, pose: 'rest', look: .3 },
  10: { brow: .2, eye: 1.25, pose: 'palms', look: .3, tilt: .15 },
  12: { brow: .5, eye: 1.3, pose: 'panic', look: .2 },
  14: { brow: -.3, eye: 1.2, pose: 'palms', look: .3 },
  16: { brow: -.2, eye: 1.1, pose: 'rest', look: .2, up: .2 },
  18: { brow: .25, eye: 1.05, pose: 'rest', look: .3, tilt: -.1 },
  20: { brow: -.1, eye: 1.2, pose: 'rest', look: .3, lean: .12 },
  22: { brow: .55, eye: .7, pose: 'rest', look: 0, down: .35 },
};
const BOTX = { 5: 'squint', 11: 'squint', 15: 'squint', 21: 'squint', 23: 'squint' };
const POSES = {
  rest: [[-.55, .12, -.95], [-.55, -.12, -.95]],   // [shoulder x, shoulder z, elbow x] per arm (L,R)
  palms: [[-.6, .55, -1.55], [-.6, -.55, -1.55]],
  panic: [[-2.75, .55, -2.25], [-2.75, -.55, -2.25]],
};
function manState(t) { let cur = MAN[0], prev = MAN[0], since = 99;
  for (const [i, s] of Object.entries(MAN)) { const st = TL[i].start - .25; if (t >= st) { prev = cur; cur = s; since = t - st; } }
  return { cur, prev, k: ease(since / .35) }; }
function speakAmt(t, who) { for (const l of TL) if (l.who === who && t >= l.start && t <= l.end) {
  const u = t - l.start; return clamp(.35 + .65 * Math.abs(Math.sin(u * 17)) * (.6 + .4 * Math.sin(u * 5.3)), 0, 1); } return 0; }
function lineAt(t) { let idx = -1; for (let i = 0; i < TL.length; i++) if (t >= TL[i].start - .15) idx = i; return idx; }

// ---------- shots ----------
const cam = new THREE.PerspectiveCamera(30, W / H, .05, 200); scene.add(cam);
const headWorld = () => head.getWorldPosition(new THREE.Vector3());
const SHOTS = {
  wide: { pos: [0.05, 1.95, 10.4], look: [0.05, 1.05, 0], fov: 40 },
  wideCity: { pos: [0.9, 1.0, 9.8], look: [0.1, 2.2, 0], fov: 46 },
  man: () => { const h = headWorld(); return { pos: [h.x + .6, h.y + .02, h.z + 3.0], look: [h.x + .05, h.y - .14, h.z], fov: 26 }; },
  bot: { pos: [BOT_POS.x - 1.2, KB_TOP + 1.0, BOT_POS.z + 5.0], look: [BOT_POS.x - .05, KB_TOP + .42, BOT_POS.z], fov: 30 },
};
// cut list: [time, shot]
const CUTS = [[0, 'man'], [TL[0].start + 2.0, 'wide']];
TL.forEach((l, i) => { if (i === 0) return; CUTS.push([l.start - .12, l.who === 'M' ? 'man' : 'bot']); });
const ins = (t, s) => { CUTS.push([t, s]); CUTS.sort((a, b) => a[0] - b[0]); };
ins(TL[12].start - .12, 'wide');
ins(TL[17].start + 1.6, 'wide');
ins(TL[21].end + .05, 'wideCity');
ins(TL[23].end + .15, 'wide');
CUTS.sort((a, b) => a[0] - b[0]);
function shotAt(t) { let s = CUTS[0]; for (const c of CUTS) if (t >= c[0]) s = c; return s; }

const END_START = TL[TL.length - 1].end + 1.6;
window.DURATION = END_START + 3.0;
const cap = document.getElementById('cap'), tag = document.getElementById('tag'), end = document.getElementById('end');

window.draw = (t) => {
  // ---- man ----
  const { cur, prev, k } = manState(t);
  const g = (p, d = 0) => lerp(prev[p] ?? d, cur[p] ?? d, k);
  const sp = speakAmt(t, 'M');
  const blink = ((t + .7) % 3.7) < .12 ? .1 : 1;
  eyes.forEach((e, i) => { e.scale.y = g('eye', 1) * blink; pupils[i].scale.y = Math.min(1, g('eye', 1)) * blink; pupils[i].position.x = (i ? 1 : -1) * .085 + .012; });
  brows.forEach((b, i) => { const w = g('brow'); b.rotation.z = (i ? -1 : 1) * w * .5; b.position.y = .1 + Math.abs(w) * .02 + (w < 0 ? .025 : 0) - (g('eye', 1) < .9 ? .015 : 0); });
  mouth.scale.y = 1 + sp * 3.2 + g('smile') * .3; mouth.scale.x = 1 - sp * .25 + g('smile') * .25;
  head.rotation.y = g('look') + Math.sin(t * 1.3) * .02;
  head.rotation.x = g('down') * 1 - g('up') + (sp ? Math.sin(t * 9) * .025 : 0);
  head.rotation.z = g('tilt') + Math.sin(t * .9) * .015;
  torso.rotation.x = g('lean') + Math.sin(t * 1.6) * .012;
  const pa = POSES[prev.pose], pb = POSES[cur.pose];
  arms.forEach((a, i) => { a.sh.rotation.x = lerp(pa[i][0], pb[i][0], k); a.sh.rotation.z = lerp(pa[i][1], pb[i][1], k);
    a.el.rotation.x = lerp(pa[i][2], pb[i][2], k) + (cur.pose === 'panic' ? Math.sin(t * 7) * .06 : 0); });
  // ---- bot ----
  const bs = speakAmt(t, 'B'); const li = lineAt(t);
  const squint = BOTX[li] && TL[li].who === 'B' ? ease((t - TL[li].start - .4) / .2) : 0;
  const bb = ((t + 1.9) % 4.3) < .1 ? .12 : 1;
  botEyes.forEach(e => { e.scale.y = Math.min(bb, lerp(1, .18, squint)); e.scale.x = lerp(1, 1.5, squint); });
  botBody.position.y = bs ? Math.abs(Math.sin(t * 8)) * .015 : 0;
  botBody.rotation.z = Math.sin(t * 1.1) * .01;
  // ---- screen ----
  const bright = t > TL[17].start + .5;
  monMat.map = bright ? uiB : uiA; monMat.color.set(bright ? '#d8d2f0' : '#b9b4d8');
  // ---- camera ----
  const [ct, name] = shotAt(t); const S = typeof SHOTS[name] === 'function' ? SHOTS[name]() : SHOTS[name];
  const push = Math.min(t - ct, 6) * .035;
  const P = new THREE.Vector3(...S.pos), L = new THREE.Vector3(...S.look);
  P.lerp(L, push * (name.startsWith('wide') ? .5 : .6));
  cam.position.copy(P); cam.fov = S.fov; cam.updateProjectionMatrix(); cam.lookAt(L);
  renderer.render(scene, cam);
  // ---- captions ----
  let txt = '', who = '';
  for (const l of TL) if (t >= l.start - .05 && t <= l.end + .25) { txt = l.text; who = l.who; }
  cap.innerHTML = txt ? '<span class="' + (who === 'B' ? 'b' : 'm') + '">' + txt + '</span>' : '';
  tag.style.opacity = t < TL[1].end ? 1 : 0;
  end.style.opacity = clamp((t - END_START) / .4, 0, 1);
};
window.READY = true;
</script>
</body></html>
