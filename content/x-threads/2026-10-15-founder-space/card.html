<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=block');
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;background:#F6F3E8;font-family:Inter,sans-serif;color:#16213A;position:relative;overflow:hidden}
.band{position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;background:#7DD2FD;opacity:.35}
.band2{position:absolute;right:120px;bottom:-200px;width:420px;height:420px;border-radius:50%;background:#7ED116;opacity:.25}
.wrap{position:absolute;inset:0;padding:90px 110px;display:flex;flex-direction:column;justify-content:space-between}
.kick{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:#004EBA;display:flex;gap:18px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;background:#EC464D;box-shadow:0 0 0 8px rgba(236,70,77,.18)}
h1{font-family:Fraunces,serif;font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.02em;color:#004EBA;max-width:1250px}
h1 em{font-style:normal;color:#16213A}
.row{display:flex;align-items:flex-end;justify-content:space-between}
.who{display:flex;align-items:center;gap:26px}
.who img{width:110px;height:110px;border-radius:24px;border:3px solid #844947}
.name{font-family:Fraunces,serif;font-weight:700;font-size:52px}
.role{font-size:30px;color:#5D6578;margin-top:4px}
.when{text-align:right}
.date{font-family:Fraunces,serif;font-weight:800;font-size:60px;color:#16213A}
.host{font-size:28px;color:#5D6578;margin-top:6px}
</style></head><body>
<div class="band"></div><div class="band2"></div>
<div class="wrap">
 <div class="kick"><span class="dot"></span>Live on X Spaces · Today</div>
 <h1>From billions to trillions: <em>what's still missing for real-world assets?</em></h1>
 <div class="row">
  <div class="who"><img src="logo.png"><div><div class="name">0xSheetal</div><div class="role">Founder, BLOK Capital</div></div></div>
  <div class="when"><div class="date">Thu 15 Oct · 4 PM UTC</div><div class="host">Hosted by @ShiftRWA · 6 builders on the panel</div></div>
 </div>
</div></body></html>
