const SMALL=/^(a|an|the|and|of|for|to|it|in|is|or|so|but|you|your|i|that's|we're|can|have|their|from|it's|just|they|them|who's|got|what|one|at|by|up|now|okay,?|on|i'll|don't|ask|say|get|into|that|there|none|usually|rules|need|where|are|below\.?|tell|me)$/i;
let curKey=null;
function build(c){const box=$('txt');box.innerHTML='';c.ws.forEach(w=>{const sp=document.createElement('span');sp.className='w';let fs=window.__dark?82:100;const raw=w.w;
 if(SMALL.test(raw)){sp.classList.add('sm');fs*=.62}if(HOT.test(raw)){sp.classList.add('hot');fs*=1.22}if(c.line===T.length-1&&/^fund$/i.test(raw))fs*=1.4;
 sp.style.fontSize=fs+'px';sp.textContent=raw;sp.dataset.s=w.s;box.appendChild(sp)})}
function drawText(t,dark){if(window.__dark!==dark){window.__dark=dark;curKey=null}const idx=CHUNKS.findIndex(c=>t>=c.s&&t<c.e);const box=$('txt');if(idx<0){box.innerHTML='';curKey=null;return}
 const c=CHUNKS[idx];if(idx!==curKey){build(c);curKey=idx}box.classList.toggle('dark',dark);
 for(const sp of box.querySelectorAll('.w')){const p=ease((t-(+sp.dataset.s-0.06))/0.2);sp.style.opacity=p;sp.style.filter=`blur(${(1-p)*10}px)`;sp.style.transform=`translateY(${(1-p)*26}px) scale(${1.15-.15*p}) scaleX(.84)`}
 box.style.opacity=cl((c.e-t)/0.08)}
// ---------------- GRAIN ----------------
const G=$('grain').getContext('2d'),GI=[];for(let k=0;k<6;k++){const im=G.createImageData(540,960);const r=rnd(k+7);for(let p=0;p<im.data.length;p+=4){const v=r()*255;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255}GI.push(im)}
// ---------------- DRAW ----------------
const fadeAt=(t,t0,d=0.4)=>ease((t-t0)/d);
window.draw=function(t){
 const [z,cx,cy]=cam(t);CAM.setAttribute('transform',`translate(540 1150) scale(${z}) translate(${-cx} ${-cy})`);
 // phone: tap at 0.7s
 const tt=0.75;const pressed=t>tt;
 btnR.setAttribute('fill',pressed?'#2a3d66':'#7DD2FD');btnT.textContent=pressed?'Requested':'Request shares';btnT.setAttribute('fill',pressed?'#d9e6ff':'#06122b');

 const fp=t<tt?ease(t/0.6):1-ease((t-tt)/0.4);finger.setAttribute('opacity',fp*.9);finger.setAttribute('cy',330-120*ease(cl(t/0.7)));
 pStatus.textContent=pressed?'Request received':'';pStatus2.textContent=pressed?'Allocation not guaranteed':'';
 // queue breathing + phone glows
 PEOPLE.forEach(p=>{const b=Math.sin(t*1.6+p.ph)*12;p.g.setAttribute('transform',`translate(${p.x} ${p.y+b}) rotate(${p.rot+Math.sin(t*.9+p.ph)*3})`);if(p.gl)p.gl.setAttribute('opacity',.5+.3*Math.sin(t*3+p.ph))});
 // lights
 const lf=fadeAt(t,S(1)+0.1,0.6),lb=fadeAt(t,S(5)+1.2,0.6),lo=fadeAt(t,S(6)+0.1,0.6);
 DF.setAttribute('opacity',.9*(1-lf));LF.setAttribute('opacity',.55*lf);fLabel.setAttribute('opacity',fadeAt(t,S(1)+0.5));
 DB.setAttribute('opacity',.97*(1-lb));LB.setAttribute('opacity',.55*lb);bLabel.setAttribute('opacity',fadeAt(t,S(5)+1.4));
 DO.setAttribute('opacity',.97*(1-lo));LO.setAttribute('opacity',.55*lo);oLabel.setAttribute('opacity',fadeAt(t,S(6)+0.3));
 airTag.setAttribute('opacity',fadeAt(t,S(2)+0.1));pubSign.setAttribute('opacity',fadeAt(t,wordT(3,/^first$/i)));
 pubLabel.setAttribute('opacity',fadeAt(t,S(3)+0.2));
 study.setAttribute('opacity',fadeAt(t,S(4)+0.1)*(1-fadeAt(t,S(5)+0.6)));
 doorGlow.setAttribute('opacity',.35+.25*Math.sin(t*2.2));
 // you
 const yr=fadeAt(t,S(7)+0.3);youRing.setAttribute('opacity',yr*(.75+.25*Math.sin(t*5)));youRing.setAttribute('r',700+80*Math.sin(t*3));youLab.setAttribute('opacity',yr);
 rule.setAttribute('opacity',fadeAt(t,wordT(9,/^\$1$/))*(1-fadeAt(t,S(10)+0.2)));
 const pl=fadeAt(t,wordT(10,/^anyone$/i),0.6);plot.setAttribute('opacity',pl);plotPath.setAttribute('opacity',pl*.9);plotPath.setAttribute('stroke-dashoffset',-t*900);
 // end: world becomes a card on linen
 const ce=ease((t-(S(12)-0.1))/1.0);const sc=1-0.45*ce;$('card').style.transform=`translateY(${-170*ce}px) scale(${sc})`;$('card').style.borderRadius=(60*ce/sc)+'px';
 $('card').style.boxShadow=ce>0?`0 ${40*ce}px ${90*ce}px rgba(40,30,20,${.35*ce})`:'none';
 const dark=ce>0.5;$('band').style.opacity=1-ce;
 $('end').style.opacity=fadeAt(t,S(12)+0.2,0.5);
 // text position: when the card is small, sit text below it
 $('txt').style.top=(dark?1370:300)+'px';
 const pill=$('pill');pill.classList.toggle('dk',dark);pill.textContent=t>S(12)?'WHO GETS IN FIRST? · PART 3 SOON':'WHO GETS IN FIRST? · PART 2';
 drawText(t,dark);
 G.putImageData(GI[Math.floor(t*18)%6],0,0);
};
draw(0);
